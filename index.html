  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Josefin+Sans:wght@100;200;300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --deep:    #1a0a1e;
      --plum:    #3d1a3a;
      --wine:    #7b2650;
      --rose:    #c2416b;
      --coral:   #e8735a;
      --gold:    #d4a847;
      --aurora1: #b03070;
      --aurora2: #8b1a6b;
      --aurora3: #c8506a;
      --aurora4: #e06050;
    }

    html, body {
      min-height: 100%;
      font-family: 'Josefin Sans', sans-serif;
      background: var(--deep);
      color: #fff;
      scrollbar-width: none;
    }

    /* ── Aurora Canvas ── */
    #aurora {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    #particles {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    /* ── Stars ── */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--d, 3s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }
    @keyframes twinkle {
      0%, 100% { opacity: var(--min-op, 0.1); transform: scale(1); }
      50%       { opacity: var(--max-op, 0.8); transform: scale(1.3); }
    }

    /* ── App Shell ── */
    #app {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── Login Screen ── */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      text-align: center;
      padding: 2rem;
      animation: fadeUp 1.2s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .playlist-cover {
      width: 180px;
      height: 180px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 0 60px rgba(192, 65, 107, 0.6), 0 0 120px rgba(192, 65, 107, 0.2);
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-12px); }
    }

    .title-block { line-height: 1; }
    .title-block h1 {
      font-family: 'Barlow', sans-serif;
      font-weight: 500;
      font-size: clamp(1.4rem, 3.8vw, 2rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
    }
    .title-block p {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-top: 0.5rem;
    }

    .btn-spotify {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.9rem 2.2rem;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #c2416b, #7b2650);
      color: #fff;
      box-shadow: 0 0 40px rgba(194, 65, 107, 0.5), 0 4px 20px rgba(0,0,0,0.4);
      transition: box-shadow 0.3s, transform 0.2s;
      position: relative;
      overflow: hidden;
    }
    .btn-spotify::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      border-radius: inherit;
    }
    .btn-spotify:hover {
      box-shadow: 0 0 70px rgba(194, 65, 107, 0.8), 0 4px 30px rgba(0,0,0,0.5);
      transform: translateY(-2px);
    }
    .btn-spotify svg { flex-shrink: 0; }

    .open-spotify-link {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      padding-bottom: 2px;
      transition: color 0.2s;
    }
    .open-spotify-link:hover { color: rgba(255,255,255,0.6); }
    .login-version {
      margin-top: 1rem;
      font-family: 'Barlow', sans-serif;
      font-size: 0.45rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.15);
    }

    /* ── Player Screen ── */
    #player-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 520px;
      padding: 1.5rem;
      gap: 1.2rem;
      animation: fadeUp 0.8s ease both;
    }

    .player-header {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .header-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      width: 100%;
    }
    .player-title {
      font-family: 'Barlow', sans-serif;
      font-weight: 500;
      font-size: 1rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    /* Stats line — flows as one wrap-friendly line; separators are inline */
    .player-stats {
      font-family: 'Barlow', sans-serif;
      font-size: 0.5rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      line-height: 1.6;
      text-align: left;
    }
    .player-stats .sep {
      color: rgba(255,255,255,0.12);
      margin: 0 0.45em;
    }
    /* Open in spotify link */
    .playlist-link {
      font-size: 0.55rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.2s;
      display: inline-flex;
      align-items: baseline;
      gap: 0.35em;
    }
    .playlist-link .arrow {
      letter-spacing: 0;
      position: relative;
      top: 0.05em;
    }
    .playlist-link:hover { color: rgba(255,255,255,0.85); }

    /* Album art row */
    .art-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      width: 100%;
    }
    #playlist-art {
      width: min(190px, 42vw);
      height: min(190px, 42vw);
      border-radius: 10px;
      object-fit: cover;
      transition: box-shadow 0.6s, transform 0.4s;
      animation: float 8s ease-in-out infinite;
    }
    #now-art { object-fit: cover; }
    #now-art-wrap {
      width: min(190px, 42vw);
      height: min(190px, 42vw);
      border-radius: 10px;
      overflow: hidden;
      background: linear-gradient(135deg, #c2416b, #7b2650);
      box-shadow: 0 0 80px rgba(192, 65, 107, 0.5), 0 20px 60px rgba(0,0,0,0.6);
      animation: float 8s ease-in-out infinite;
      transition: box-shadow 0.6s;
    }
    #now-art-wrap.playing {
      box-shadow: 0 0 100px rgba(192, 65, 107, 0.7), 0 0 200px rgba(192, 65, 107, 0.2), 0 20px 60px rgba(0,0,0,0.6);
    }
    #now-art {
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #now-art.loaded { opacity: 1; }


    #playlist-art {
      box-shadow: 0 0 40px rgba(192, 65, 107, 0.25), 0 20px 40px rgba(0,0,0,0.5);
      opacity: 0.85;
      animation-delay: -3s;
    }

    /* Track info */
    .track-info { text-align: center; width: 100%; }
    #track-name {
      font-family: 'Barlow', sans-serif;
      font-weight: 500;
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-share-btn {
      margin-top: 0.6rem;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      padding: 0.3rem 0.7rem;
      cursor: pointer;
      font-family: 'Barlow', sans-serif;
      font-size: 0.5rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .track-share-btn:hover {
      color: rgba(255,255,255,0.85);
      border-color: rgba(194,65,107,0.45);
      background: rgba(194,65,107,0.1);
    }
    #artist-name {
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-top: 0.3rem;
    }

    /* Progress */
    .progress-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    #progress-bar {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.12);
      cursor: pointer;
      outline: none;
    }
    #progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #c2416b;
      box-shadow: 0 0 8px rgba(194,65,107,0.8);
      cursor: pointer;
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.35);
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
    }
    .ctrl-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,0.5);
      transition: color 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
    }
    .ctrl-btn:hover { color: #fff; transform: scale(1.15); }
    .ctrl-btn.play-pause {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #c2416b, #7b2650);
      color: #fff;
      justify-content: center;
      box-shadow: 0 0 30px rgba(194,65,107,0.6);
      transition: box-shadow 0.3s, transform 0.15s;
    }
    .ctrl-btn.play-pause:hover {
      box-shadow: 0 0 50px rgba(194,65,107,0.9);
      transform: scale(1.08);
    }

    /* Volume */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      width: 100%;
    }
    .volume-row svg { color: rgba(255,255,255,0.4); flex-shrink: 0; }
    #volume-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.12);
      cursor: pointer;
      outline: none;
    }
    #volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.6);
      cursor: pointer;
    }

    /* Queue */
    .queue-section { width: 100%; }
    .queue-label {
      font-size: 0.55rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      margin-bottom: 0.6rem;
    }
    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      max-height: 60px;
      overflow-y: hidden;
      scrollbar-width: none;
      opacity: 1;
      transition: opacity 0.5s ease;
    }
    .queue-list.fading { opacity: 0; }
    .queue-list::-webkit-scrollbar { display: none; }
    .queue-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .queue-item:hover { background: rgba(255,255,255,0.06); }
    .queue-item.active { background: rgba(194,65,107,0.15); }
    .queue-thumb {
      width: 32px; height: 32px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .queue-meta { overflow: hidden; flex: 1; }
    .queue-track {
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .queue-artist {
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .queue-dur {
      font-size: 0.55rem;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.08em;
      flex-shrink: 0;
    }
    .adder-avatar {
      width: 20px; height: 20px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      opacity: 0.6;
    }
    .adder-initials {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: rgba(194,65,107,0.3);
      border: 1px solid rgba(194,65,107,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.45rem;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,0.5);
      flex-shrink: 0;
      text-transform: uppercase;
    }
    /* Error / Loading */
    .status-msg {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.4);
      text-align: center;
    }
    #error-msg {
      color: rgba(232,115,90,0.8);
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-align: center;
      display: none;
    }

    /* Loading pulse — applied to player surfaces until first track arrives */
    @keyframes pulse-load {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.25; }
    }
    .loading-pulse {
      animation: pulse-load 1.6s ease-in-out infinite;
    }

    /* Glassmorphism card for player */
    .glass-card {
      background: rgba(26, 10, 30, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 1.5rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* Shuffle button */
    /* Sort toggle */
    /* Shimmer loading */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position:  400px 0; }
    }
    .shimmer {
      background: linear-gradient(90deg,
        rgba(255,255,255,0.04) 25%,
        rgba(255,255,255,0.10) 50%,
        rgba(255,255,255,0.04) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.8s ease-in-out infinite;
      border-radius: 4px;
      color: transparent !important;
      pointer-events: none;
      user-select: none;
    }
    .shimmer * { visibility: hidden; }
    #now-art-wrap.shimmer, #playlist-art.shimmer {
      border-radius: 10px;
      background: linear-gradient(90deg,
        rgba(255,255,255,0.04) 25%,
        rgba(255,255,255,0.09) 50%,
        rgba(255,255,255,0.04) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.8s ease-in-out infinite;
    }


    /* Header actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-shrink: 0;
    }
    .icon-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 100px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: rgba(255,255,255,0.5);
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .icon-btn:hover {
      color: #fff;
      border-color: rgba(194,65,107,0.4);
      background: rgba(194,65,107,0.08);
    }
    .icon-btn.saved {
      color: #c2416b;
      border-color: rgba(194,65,107,0.5);
      background: rgba(194,65,107,0.18);
    }
    .icon-btn.saved svg { fill: #c2416b; stroke: #c2416b; }

    /* Share fallback menu — desktop browsers without Web Share API */
    .share-menu {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      z-index: 200;
      background: rgba(13, 5, 16, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      min-width: 220px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .share-menu.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    .share-menu[hidden] { display: none; }
    .share-opt {
      background: none;
      border: none;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Barlow', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      text-align: left;
      transition: background 0.15s, color 0.15s;
    }
    .share-opt:hover {
      background: rgba(194,65,107,0.15);
      color: #fff;
    }

    /* Backdrop for share menu */
    .share-backdrop {
      position: fixed;
      inset: 0;
      z-index: 199;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .share-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* Logo tooltip — quiet acknowledgement on hover/long-press */
    .logo-tooltip-wrap {
      position: relative;
      display: inline-block;
      line-height: 0;
    }
    .logo-tooltip {
      position: absolute;
      bottom: -2.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(-4px);
      background: rgba(13, 5, 16, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 0.5rem 0.9rem;
      border-radius: 100px;
      font-family: 'Barlow', sans-serif;
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 50;
      line-height: 1;
    }
    .logo-tooltip-wrap:hover .logo-tooltip,
    .logo-tooltip-wrap:focus-within .logo-tooltip,
    .logo-tooltip-wrap:active .logo-tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Footer */
    .site-footer {
      width: 100%;
      max-width: 520px;
      text-align: center;
      padding: 1.5rem 0 2.5rem;
      font-family: 'Barlow', sans-serif;
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .site-footer .version {
      font-size: 0.45rem;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.15);
    }
    .site-footer a {
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      padding-bottom: 1px;
      transition: color 0.2s, border-color 0.2s;

(function initAurora() {
  const canvas = document.getElementById('aurora');

  let W, H;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  // Expanded palette with more orange tones and a vivid focal orb.
  const orbs = [

    // deep magenta
    { r:[139, 26,107], xP:0.65, yP:0.55, rW:0.70, rH:0.55, alpha:0.26, alphaA:0.10, sxA:0.20, syA:0.14, sxF:0.00008 , syF:0.00009 , sxO:2.4 , syO:0.7, aF:0.00013, aO:1.2 },
    // violet
    { r:[110, 60,180], xP:0.40, yP:0.18, rW:0.60, rH:0.45, alpha:0.20, alphaA:0.12, sxA:0.22, syA:0.16, sxF:0.00010 , syF:0.00007 , sxO:4.7 , syO:3.2, aF:0.00015, aO:2.1 },
    // electric blue
    { r:[ 60,100,200], xP:0.82, yP:0.40, rW:0.55, rH:0.42, alpha:0.18, alphaA:0.10, sxA:0.20, syA:0.13, sxF:0.00007 , syF:0.00011 , sxO:1.8 , syO:5.0, aF:0.00012, aO:0.8 },
    // burnt orange
    { r:[235,120, 70], xP:0.15, yP:0.65, rW:0.65, rH:0.50, alpha:0.32, alphaA:0.14, sxA:0.18, syA:0.14, sxF:0.00012 , syF:0.00009 , sxO:3.3 , syO:2.1, aF:0.00010, aO:3.4 },
    // VIVID ORANGE — the showpiece orb
    { r:[255,110, 40], xP:0.35, yP:0.45, rW:0.55, rH:0.42, alpha:0.55, alphaA:0.18, sxA:0.22, syA:0.16, sxF:0.00014 , syF:0.00010 , sxO:1.5 , syO:4.2, aF:0.00018, aO:2.8 },
    // amber gold
    { r:[245,170, 80], xP:0.55, yP:0.78, rW:0.55, rH:0.42, alpha:0.24, alphaA:0.12, sxA:0.16, syA:0.18, sxF:0.00011 , syF:0.00008 , sxO:5.6 , syO:4.4, aF:0.00014, aO:1.7 },
    // warm red
    { r:[215, 60, 70], xP:0.75, yP:0.85, rW:0.50, rH:0.40, alpha:0.22, alphaA:0.10, sxA:0.15, syA:0.18, sxF:0.00009 , syF:0.00008 , sxO:5.0 , syO:3.7, aF:0.00014, aO:5.2 },
    // soft coral highlight
    { r:[255,140,100], xP:0.50, yP:0.50, rW:0.40, rH:0.32, alpha:0.16, alphaA:0.10, sxA:0.20, syA:0.16, sxF:0.00013 , syF:0.00010 , sxO:0.9 , syO:6.0, aF:0.00016, aO:4.7 },
  ];

  // Curtain waves — vertical ripple bands layered on top of orbs.
  const curtains = [
    { color:[200, 80,130], yCenter:0.32, height:0.28, alpha:0.45, waveAmp:0.10, waveFreq:0.0028, waveSpeed: 0.00018, shimmerFreq:0.0012, shimmerAmp:0.025, shimmerSpeed: 0.00040, phase:0   },
    { color:[240,130, 80], yCenter:0.52, height:0.24, alpha:0.38, waveAmp:0.08, waveFreq:0.0024, waveSpeed:-0.00014, shimmerFreq:0.0015, shimmerAmp:0.022, shimmerSpeed:-0.00045, phase:1.7 },
    { color:[220, 90, 90], yCenter:0.70, height:0.22, alpha:0.32, waveAmp:0.07, waveFreq:0.0020, waveSpeed: 0.00012, shimmerFreq:0.0010, shimmerAmp:0.018, shimmerSpeed: 0.00035, phase:3.4 },
  ];

  // Draw a single soft radial orb.
  // We use a large radial gradient that falls to 0 alpha at the edge —
  // no hard boundary, just an infinite feather.
  // Time-of-day colour tint: hour 0-6 = cool/violet, 6-12 = dawn warm, 12-18 = day rose, 18-24 = dusk amber
  function getTimeTint() {
    const h = new Date().getHours() + new Date().getMinutes() / 60;
    // Smooth interpolation across 24h cycle. Returns RGB multipliers [r, g, b]
    // Anchors: 0 = cool, 6 = warm pink/orange, 12 = balanced rose, 18 = warm amber, 24 = cool again
    const anchors = [
      { h: 0,  rgb: [0.75, 0.78, 1.10] }, // midnight cool/violet
      { h: 4,  rgb: [0.80, 0.78, 1.05] },
      { h: 7,  rgb: [1.15, 0.95, 0.85] }, // dawn warm
      { h: 12, rgb: [1.00, 0.95, 0.95] }, // midday neutral
      { h: 17, rgb: [1.15, 0.90, 0.80] }, // late afternoon warm
      { h: 20, rgb: [1.20, 0.85, 0.80] }, // dusk amber
      { h: 23, rgb: [0.85, 0.80, 1.05] },
      { h: 24, rgb: [0.75, 0.78, 1.10] },
    ];
    let a, b;
    for (let i = 0; i < anchors.length - 1; i++) {
      if (h >= anchors[i].h && h <= anchors[i+1].h) { a = anchors[i]; b = anchors[i+1]; break; }
    }
    if (!a) { a = anchors[0]; b = anchors[1]; }
    const t = (h - a.h) / (b.h - a.h);
    return [
      a.rgb[0] + (b.rgb[0] - a.rgb[0]) * t,
      a.rgb[1] + (b.rgb[1] - a.rgb[1]) * t,
      a.rgb[2] + (b.rgb[2] - a.rgb[2]) * t,
    ];
  }
  let timeTint = getTimeTint();
  // Refresh every 5 minutes — tint shifts gradually
  setInterval(() => { timeTint = getTimeTint(); }, 5 * 60 * 1000);

  function drawOrb(o, t) {
    const cx = W * (o.xP + Math.sin(t * o.sxF + o.sxO) * o.sxA);
    const cy = H * (o.yP + Math.sin(t * o.syF + o.syO) * o.syA);
    const rx = W * o.rW;
    const ry = H * o.rH;
    // Apply time-of-day tint, clamp to 0-255
    const r = Math.min(255, o.r[0] * timeTint[0]);
    const g = Math.min(255, o.r[1] * timeTint[1]);
    const b = Math.min(255, o.r[2] * timeTint[2]);
    // Breathing alpha — each orb pulses brightness independently
    const a = Math.max(0, o.alpha + Math.sin(t * o.aF + o.aO) * (o.alphaA || 0));

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, ry / rx);
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    grad.addColorStop(0.00, `rgba(${r},${g},${b},${a.toFixed(3)})`);
    grad.addColorStop(0.35, `rgba(${r},${g},${b},${(a * 0.6).toFixed(3)})`);
    grad.addColorStop(0.65, `rgba(${r},${g},${b},${(a * 0.18).toFixed(3)})`);
    grad.addColorStop(1.00, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, rx, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawCurtain(c, t) {
    const yC      = H * c.yCenter;
    const halfH   = H * c.height * 0.5;
    const ampPx   = H * c.waveAmp;
    const shimAmp = H * c.shimmerAmp;
    const [r,g,b] = c.color;

    ctx.beginPath();
    const step = 6;
    for (let x = 0; x <= W + step; x += step) {
      const wave =
        Math.sin(x * c.waveFreq    + t * c.waveSpeed    + c.phase) * ampPx +
        Math.sin(x * c.shimmerFreq + t * c.shimmerSpeed + c.phase * 0.7) * shimAmp;
      const y = yC + wave - halfH;
      if (x === 0) ctx.moveTo(x, y);
      else         ctx.lineTo(x, y);
    }
    for (let x = W; x >= -step; x -= step) {
      const wave =
        Math.sin(x * c.waveFreq    + t * c.waveSpeed    + c.phase + 0.4) * ampPx +
        Math.sin(x * c.shimmerFreq + t * c.shimmerSpeed + c.phase * 0.7 + 0.6) * shimAmp;
      const y = yC + wave + halfH;
      ctx.lineTo(x, y);
    }
    ctx.closePath();

    const grad = ctx.createLinearGradient(0, yC - halfH * 1.5, 0, yC + halfH * 1.5);
    grad.addColorStop(0.00, `rgba(${r},${g},${b},0)`);
    grad.addColorStop(0.40, `rgba(${r},${g},${b},${c.alpha.toFixed(3)})`);
    grad.addColorStop(0.60, `rgba(${r},${g},${b},${c.alpha.toFixed(3)})`);
    grad.addColorStop(1.00, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.fill();
  }

  let rafId;
  function frame(ts) {
    ctx.clearRect(0, 0, W, H);
    const bg = ctx.createRadialGradient(W*0.5, H*0.38, 0, W*0.5, H*0.38, H);
    bg.addColorStop(0,   '#28102e');
    bg.addColorStop(0.6, '#1a0a22');
    bg.addColorStop(1,   '#0b0410');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    orbs.forEach(o => drawOrb(o, ts));
    curtains.forEach(c => drawCurtain(c, ts));
    ctx.globalCompositeOperation = 'source-over';
    rafId = requestAnimationFrame(frame);
  }
  rafId = requestAnimationFrame(frame);

  // Pause animation when tab is hidden — saves CPU + battery
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      cancelAnimationFrame(rafId);
    } else {
      rafId = requestAnimationFrame(frame);
    }
  });

  // Debounce resize so we don't recalculate on every pixel
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 100);
  });
})();

// ─────────────────────────────────────────────
// Rising particles (ambient dust motes)
// ─────────────────────────────────────────────
(function initParticles() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H;
  const count = window.innerWidth < 600 ? 30 : 60;
  const particles = [];

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width  = window.innerWidth * dpr;
    H = canvas.height = window.innerHeight * dpr;
    canvas.style.width  = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 150);
  });
  resize();

  // Reset a particle to start from below the screen
  function spawn(p, fromBottom = true) {
    p.x = Math.random() * window.innerWidth;
    p.y = fromBottom ? window.innerHeight + Math.random() * 50 : Math.random() * window.innerHeight;
    p.size = Math.random() * 1.5 + 0.4;
    p.speed = Math.random() * 0.15 + 0.05; // very slow upward drift
    p.swayAmp = Math.random() * 30 + 10;   // horizontal sway
    p.swayFreq = Math.random() * 0.001 + 0.0005;
    p.swayPhase = Math.random() * Math.PI * 2;
    p.alpha = Math.random() * 0.5 + 0.15;
    p.alphaSpeed = Math.random() * 0.0008 + 0.0003;
    p.alphaPhase = Math.random() * Math.PI * 2;
    p.baseX = p.x;
  }

  for (let i = 0; i < count; i++) {
    const p = {};
    spawn(p, false); // initial spawn anywhere on screen
    particles.push(p);
  }

  let rafId;
  function frame(ts) {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    particles.forEach(p => {
      // Drift upward
      p.y -= p.speed;
      // Sway horizontally with sine
      p.x = p.baseX + Math.sin(ts * p.swayFreq + p.swayPhase) * p.swayAmp;
      // Pulse alpha
      const a = p.alpha * (0.6 + Math.sin(ts * p.alphaSpeed + p.alphaPhase) * 0.4);

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 220, 200, ${a.toFixed(3)})`;
      ctx.fill();

      // Respawn from bottom when off-screen at top
      if (p.y < -10) spawn(p, true);
    });
    rafId = requestAnimationFrame(frame);
  }
  rafId = requestAnimationFrame(frame);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(rafId);
    else rafId = requestAnimationFrame(frame);
  });
})();

// Auth (PKCE)
// ─────────────────────────────────────────────
function base64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function generatePKCE() {
  const verifier  = base64url(crypto.getRandomValues(new Uint8Array(32)));
  const challenge = base64url(await crypto.subtle.digest('SHA-256',
    new TextEncoder().encode(verifier)));
  return { verifier, challenge };
}

async function login() {
  // Visual feedback that something is happening
  const btn = document.getElementById('login-btn');
  if (btn) {
    btn.style.opacity = '0.6';
    btn.style.pointerEvents = 'none';
    btn.textContent = 'opening spotify…';
  }
  const { verifier, challenge } = await generatePKCE();
  sessionStorage.setItem('pkce_verifier', verifier);
  const url = new URL('https://accounts.spotify.com/authorize');
  url.searchParams.set('client_id',             CLIENT_ID);
  url.searchParams.set('response_type',         'code');
  url.searchParams.set('redirect_uri',          REDIRECT_URI);
  url.searchParams.set('scope',                 SCOPES);
  url.searchParams.set('code_challenge_method', 'S256');
  url.searchParams.set('code_challenge',        challenge);

  // Try popup first; fall back to redirect if blocked
  const w = 480, h = 640;
  const left = Math.round(screen.width  / 2 - w / 2);
  const top  = Math.round(screen.height / 2 - h / 2);
  const popup = window.open(url.toString(), 'spotify-login',
    `width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes`);

  if (!popup || popup.closed || typeof popup.closed === 'undefined') {
    // Popup blocked — fall back to full redirect
    window.location = url.toString();
    return;
  }

  showPlayer();
  console.log('[login] popup opened, REDIRECT_URI=', REDIRECT_URI);

  // Helper to finish the auth flow once we have a code
  let captured = false;
  async function completeAuth(code, errParam) {
    if (captured) return;
    captured = true;
    clearInterval(poll);
    try { popup.close(); } catch(e) {}
    if (code) {
      console.log('[login] code captured, exchanging…');
      try {
        await exchangeCode(code);
        sessionStorage.removeItem('pkce_verifier');
        console.log('[login] exchange success, loading SDK');
        loadSDK();
      } catch(e) {
        console.error('[login] exchangeCode failed:', e);
        sessionStorage.removeItem('pkce_verifier');
        showError('Login failed. Try again.');
        resetLoginUI();
      }
    } else if (errParam) {
      console.warn('[login] popup returned error:', errParam);
      showError('Login cancelled.');
      resetLoginUI();
    } else {
      showError('Login failed. Try again.');
      resetLoginUI();
    }
  }

  // BACKUP: listen for postMessage from popup (if a small bootstrap can send one)
  function onMsg(e) {
    if (!e.data || e.data.type !== 'bt-auth') return;
    if (e.origin !== window.location.origin) return;
    console.log('[login] received auth via postMessage');
    window.removeEventListener('message', onMsg);
    completeAuth(e.data.code, e.data.error);
  }
  window.addEventListener('message', onMsg);

  // PRIMARY: poll the popup URL
  const poll = setInterval(async () => {
    if (captured) return;

    let popupUrl = null;
    try { popupUrl = popup.location.href; } catch(e) { /* cross-origin, keep polling */ }

    if (popupUrl) {
      console.log('[login] popup url visible:', popupUrl);
      if (popupUrl.startsWith(REDIRECT_URI) || popupUrl.includes('code=') || popupUrl.includes('error=')) {
        const u = new URL(popupUrl);
        const code = u.searchParams.get('code');
        const errParam = u.searchParams.get('error');
        await completeAuth(code, errParam);
        return;
      }
    }

    if (popup.closed && !captured) {
      clearInterval(poll);
      console.log('[login] popup closed without capture, waiting 500ms grace…');
      setTimeout(() => {
        if (!captured) {
          console.warn('[login] no capture after grace period');
          showError('Login cancelled.');
          resetLoginUI();
        }
      }, 500);
    }
  }, 250);
}

function resetLoginUI() {
  // Revert to the login screen so user can try again
  document.getElementById('player-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  const btn = document.getElementById('login-btn');
  if (btn) {
    btn.style.opacity = '';
    btn.style.pointerEvents = '';
    btn.innerHTML = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.51 17.314a.748.748 0 01-1.03.249c-2.82-1.723-6.369-2.112-10.547-1.157a.748.748 0 01-.354-1.453c4.574-1.047 8.496-.596 11.682 1.337a.748.748 0 01.249 1.024zm1.47-3.27a.936.936 0 01-1.287.308c-3.226-1.982-8.144-2.556-11.96-1.399a.937.937 0 01-.545-1.791c4.358-1.322 9.775-.681 13.484 1.594a.937.937 0 01.308 1.288zm.126-3.405c-3.868-2.297-10.248-2.508-13.939-1.387a1.124 1.124 0 01-.653-2.151c4.239-1.287 11.284-1.038 15.738 1.605a1.124 1.124 0 01-1.146 1.933z"/>
      </svg>
      Sign in with Spotify
    `;
  }
}

function loadSDK() {
  if (window.Spotify) {
    window.onSpotifyWebPlaybackSDKReady();
    return;
  }
  const s = document.createElement('script');
  s.src = 'https://sdk.scdn.co/spotify-player.js';
  document.head.appendChild(s);
}

async function exchangeCode(code) {
  const verifier = sessionStorage.getItem('pkce_verifier');
  if (!verifier) {
    throw new Error('Missing PKCE verifier — session may have been lost. Please try logging in again.');
  }
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type:    'authorization_code',
      code,
      redirect_uri:  REDIRECT_URI,
      client_id:     CLIENT_ID,
      code_verifier: verifier,
    }),
  });
  if (!res.ok) {
    const errBody = await res.text();
    console.error('[exchangeCode] Spotify returned', res.status, errBody);
    throw new Error(`Token exchange failed (${res.status})`);
  }
  const data = await res.json();
  storeTokens(data);
  return data.access_token;
}

async function refreshToken() {
  const rt = localStorage.getItem('sp_refresh');
  if (!rt) return null;
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type:    'refresh_token',
      refresh_token: rt,
      client_id:     CLIENT_ID,
    }),
  });
  if (!res.ok) {
    // Refresh token is invalid/expired — clear all tokens so user re-logs in fresh
    console.warn('[refreshToken] failed, clearing stored tokens');
    localStorage.removeItem('sp_access');
    localStorage.removeItem('sp_refresh');
    localStorage.removeItem('sp_expiry');
    return null;
  }
  const data = await res.json();
  storeTokens(data);
  return data.access_token;
}

function storeTokens(data) {
  localStorage.setItem('sp_access',  data.access_token);
  localStorage.setItem('sp_refresh', data.refresh_token || localStorage.getItem('sp_refresh'));
  localStorage.setItem('sp_expiry',  Date.now() + data.expires_in * 1000);
}

async function getToken() {
  const expiry = +localStorage.getItem('sp_expiry') || 0;
  if (Date.now() < expiry - 60000) return localStorage.getItem('sp_access');
  return await refreshToken();
}

// ─────────────────────────────────────────────
// Spotify API helpers
// ─────────────────────────────────────────────
async function api(path, opts = {}) {
  const token = await getToken();
  const res = await fetch('https://api.spotify.com/v1' + path, {
    ...opts,
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  if (res.status === 204) return null;
  if (!res.ok) throw new Error(await res.text());
  // Some endpoints return empty/text bodies — try JSON, fall back gracefully
  const text = await res.text();
  if (!text) return null;
  try { return JSON.parse(text); } catch(e) { return null; }
}

// ─────────────────────────────────────────────
// Player state
// ─────────────────────────────────────────────
let player, deviceId;
let pendingStartUri = null; // Track to play when user first hits play
let tracks = [], trackItems = [], currentUri = null;
let progressInterval;

function ms(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

function applyAlbumGlow(imgEl) {
  // Sample average colour from the image and apply as glow on the wrapper
  try {
    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 32;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(imgEl, 0, 0, 32, 32);
    const data = ctx.getImageData(0, 0, 32, 32).data;
    let r = 0, g = 0, b = 0, count = 0;
    // Weight toward saturated pixels for a more representative colour
    for (let i = 0; i < data.length; i += 4) {
      const pr = data[i], pg = data[i+1], pb = data[i+2];
      const max = Math.max(pr, pg, pb);
      const min = Math.min(pr, pg, pb);
      const sat = max === 0 ? 0 : (max - min) / max;
      const weight = 0.3 + sat * 0.7; // saturated pixels count more
      r += pr * weight; g += pg * weight; b += pb * weight;
      count += weight;
    }
    r = Math.round(r / count);
    g = Math.round(g / count);
    b = Math.round(b / count);
    // Boost brightness so dark covers still glow
    const brightness = (r + g + b) / 3;
    if (brightness < 100) {
      const boost = 100 / Math.max(brightness, 30);
      r = Math.min(255, r * boost);
      g = Math.min(255, g * boost);
      b = Math.min(255, b * boost);
    }
    const wrap = document.getElementById('now-art-wrap');
    if (wrap) {
      wrap.style.boxShadow = `0 0 80px rgba(${r|0},${g|0},${b|0},0.55), 0 0 160px rgba(${r|0},${g|0},${b|0},0.18), 0 20px 60px rgba(0,0,0,0.6)`;
      wrap.style.transition = 'box-shadow 1.5s ease';
    }
  } catch(e) {
    // CORS may block getImageData on some Spotify CDN images — silent fallback to default glow
  }
}

function setPlaying(playing) {
  document.getElementById('icon-play').style.display  = playing ? 'none' : '';
  document.getElementById('icon-pause').style.display = playing ? ''     : 'none';
  document.getElementById('now-art-wrap')?.classList.toggle('playing', playing);
}

let currentTrack = null;
function updateTrackUI(item) {
  if (!item) return;
  currentUri = item.uri;
  currentTrack = item;
  document.getElementById('track-name').textContent  = item.name;
  document.getElementById('artist-name').textContent = item.artists.map(a=>a.name).join(', ');
  const art = item.album?.images?.[0]?.url;
  if (art) {
    const artEl = document.getElementById('now-art');
    if (artEl.src !== art) {
      artEl.classList.remove('loaded');
      artEl.crossOrigin = 'anonymous';
      artEl.onload = () => {
        artEl.classList.add('loaded');
        applyAlbumGlow(artEl);
      };
      artEl.src = art;
    }
  }
  document.getElementById('time-total').textContent  = ms(item.duration_ms);
  // Remove shimmer + pulse now that we have real data
  clearLoadingState();
  highlightQueue(item.uri);
  // highlightQueue already updates the active class on existing rows --
  // no need to re-render the full list (which would reset pagination).
}

function highlightQueue(uri) {
  document.querySelectorAll('.queue-item, .full-track-item').forEach(el => {
    el.classList.toggle('active', el.dataset.uri === uri);
  });
}

function startProgress(position, duration) {
  clearInterval(progressInterval);
  const bar = document.getElementById('progress-bar');
  const cur = document.getElementById('time-current');
  let pos = position;
  bar.max = duration;
  bar.value = pos;
  cur.textContent = ms(pos);
  progressInterval = setInterval(() => {
    pos += 1000;
    if (pos > duration) { clearInterval(progressInterval); return; }
    bar.value = pos;
    cur.textContent = ms(pos);
  }, 1000);
}

// ─────────────────────────────────────────────
// Queue / playlist fetch
// ─────────────────────────────────────────────
const PLAYLIST_CACHE_KEY = 'bt_playlist_cache_v1';
const PLAYLIST_CACHE_TTL = 10 * 60 * 1000; // 10 minutes

function readPlaylistCache() {
  try {
    const raw = localStorage.getItem(PLAYLIST_CACHE_KEY);
    if (!raw) return null;
    const { ts, data } = JSON.parse(raw);
    if (Date.now() - ts > PLAYLIST_CACHE_TTL) return null;
    return data;
  } catch(e) { return null; }
}

function writePlaylistCache(data) {
  try {
    localStorage.setItem(PLAYLIST_CACHE_KEY, JSON.stringify({ ts: Date.now(), data }));
  } catch(e) { /* quota exceeded — silent */ }
}

async function fetchPlaylistTracks() {
  // Try cache first for instant render
  const cached = readPlaylistCache();
  if (cached) {
    console.log('[cache] using cached playlist (' + cached.tracks.length + ' tracks)');
    tracks = cached.tracks;
    trackItems = cached.tracks;
    if (cached.coverImg) {
      const el = document.getElementById('login-cover');
      if (el) el.src = cached.coverImg;
    }
    if (cached.stats) renderStats(cached.stats);
    renderQueue();
    // Refresh in background — silently update if changed
    setTimeout(() => fetchPlaylistTracksFresh(), 1500);
    return;
  }
  return fetchPlaylistTracksFresh();
}

async function fetchPlaylistTracksFresh() {
  const playlistMetaPromise = api(`/playlists/${PLAYLIST_ID}?fields=images,tracks(total),followers(total)`);
  const allRaw = [];
  let offset = 0;
  const pageSize = 100;
  while (true) {
    const page = await api(
      `/playlists/${PLAYLIST_ID}/tracks?limit=${pageSize}&offset=${offset}&fields=items(added_by(id),track(uri,name,duration_ms,artists(name),album(images))),next`
    );
    const items = (page?.items || []).filter(i => i.track);
    allRaw.push(...items);
    if (!page?.next) break;
    offset += pageSize;
    // Safety cap so we never spin forever
    if (offset > 10000) break;
  }

  // Collect unique user IDs (cap at first 50 to avoid hammering API)
  const userIds = [...new Set(allRaw.map(i => i.added_by?.id).filter(Boolean))].slice(0, 50);
  const profileMap = {};
  await Promise.all(userIds.map(async id => {
    try {
      const u = await api(`/users/${id}`);
      profileMap[id] = { name: u.display_name || id, img: u.images?.[0]?.url || null };
    } catch(e) {
      profileMap[id] = { name: id, img: null };
    }
  }));

  // Attach adder info; reverse for newest-first default
  trackItems = allRaw.map(i => ({
    ...i.track,
    adder: profileMap[i.added_by?.id] || null,
  })).reverse();

  tracks = trackItems;

  const playlistData = await playlistMetaPromise;
  const coverImg = playlistData?.images?.[0]?.url;
  if (coverImg) {
    const el = document.getElementById('login-cover');
    if (el) el.src = coverImg;
  }
  // Compute stats
  const totalMs = trackItems.reduce((s, t) => s + (t.duration_ms || 0), 0);
  const totalHours = Math.round(totalMs / 1000 / 60 / 60);
  const contributors = new Set(allRaw.map(i => i.added_by?.id).filter(Boolean)).size;
  const followers = playlistData?.followers?.total || 0;
  const stats = { totalHours, contributors, followers, trackCount: trackItems.length };

  // Cache for next page load (now includes stats)
  writePlaylistCache({ tracks: trackItems, coverImg, stats });
  renderStats(stats);
  renderQueue();
}

function renderStats(s) {
  if (!s) return;
  const fmt = n => n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/, '') + 'k' : n;
  const parts = [
    'since 2006',
    `${s.trackCount} tracks`,
    `${s.totalHours} hours`,
    `${s.contributors} contributors`,
  ];
  if (s.followers > 0) parts.push(`${fmt(s.followers)} saved`);
  const el = document.getElementById('player-stats');
  if (el) el.innerHTML = parts.join('<span class="sep">·</span>');
}

function adderAvatar(adder, cls, initialsCls) {
  if (!adder) return ''; // show nothing if no adder info
  if (adder.img) return `<img class="${cls}" src="${adder.img}" alt="${adder.name}" title="Added by ${adder.name}" loading="lazy" decoding="async" />`;
  const initials = adder.name.split(' ').map(w=>w[0]).join('').slice(0,2);
  return `<div class="${initialsCls}" title="Added by ${adder.name}">${initials}</div>`;
}

function renderQueueItems(items) {
  const list = document.getElementById('queue-list');
  if (!list) return;
  list.innerHTML = '';
  items.forEach(t => {
    const el = document.createElement('div');
    el.className = 'queue-item';
    el.dataset.uri = t.uri;
    const thumb = t.album?.images?.[1]?.url || t.album?.images?.[0]?.url || '';
    // Try to find adder from our local tracks data
    const localTrack = tracks.find(lt => lt.uri === t.uri);
    el.innerHTML = `
      <img class="queue-thumb" src="${thumb}" alt="" loading="lazy" decoding="async" />
      <div class="queue-meta">
        <div class="queue-track">${t.name}</div>
        <div class="queue-artist">${t.artists.map(a=>a.name).join(', ')}</div>
      </div>
      ${adderAvatar(localTrack?.adder || null, 'adder-avatar', 'adder-initials')}
      <div class="queue-dur">${ms(t.duration_ms)}</div>
    `;
    el.addEventListener('click', () => player?.nextTrack());
    list.appendChild(el);
  });
}

async function refreshQueue() {
  const list = document.getElementById('queue-list');
  try {
    const queueData = await api('/me/player/queue');
    if (queueData?.queue?.length) {
      renderQueueItems(queueData.queue.slice(0, 1));
    } else if (tracks.length) {
      const idx = currentUri ? tracks.findIndex(t => t.uri === currentUri) : -1;
      const upcoming = tracks.slice(idx + 1, idx + 2);
      renderQueueItems(upcoming.length ? upcoming : tracks.slice(0, 1));
    }
  } catch(e) {}
  if (list) list.classList.remove('fading');
}

function renderQueue() {
  const idx = currentUri ? tracks.findIndex(t => t.uri === currentUri) : -1;
  const upcoming = tracks.slice(idx + 1, idx + 6);
  renderQueueItems(upcoming.length ? upcoming.slice(0, 1) : tracks.slice(0, 1));
}

let playWindowStart = 0; // index into tracks where current chunk began

async function playPlaylist(forcedStartUri) {
  if (!tracks.length) {
    console.warn('[playPlaylist] no tracks loaded yet');
    return;
  }

  let startIdx = 0;
  const isFirstVisit = !localStorage.getItem('bt_visited');

  if (forcedStartUri) {
    const idx = tracks.findIndex(t => t.uri === forcedStartUri);
    if (idx !== -1) {
      startIdx = idx;
      console.log('[playPlaylist] starting from shared track:', tracks[idx].name);
    } else {
      console.warn('[playPlaylist] shared track URI not in playlist:', forcedStartUri);
    }
  } else if (isFirstVisit) {
    startIdx = Math.floor(Math.random() * tracks.length);
    console.log('[playPlaylist] first visit — random start at index', startIdx);
  }

  const startUri = tracks[startIdx].uri;
  // Queue tail for the session — next tracks (random order so shuffle still feels natural)
  const tail = tracks.slice(startIdx + 1, startIdx + 50);
  // Shuffle the tail so playback feels random even without Spotify's shuffle
  for (let i = tail.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [tail[i], tail[j]] = [tail[j], tail[i]];
  }
  playWindowStart = startIdx;

  const endpoint = deviceId ? `/me/player/play?device_id=${deviceId}` : '/me/player/play';

  // STEP 0: Force shuffle OFF first. The SDK has already activated our device by
  // this point, so the shuffle endpoint should accept this call. If it doesn't,
  // we still proceed — the single-URI play in step 1 is robust enough.
  if (deviceId) {
    try {
      await api(`/me/player/shuffle?state=false&device_id=${deviceId}`, { method: 'PUT' });
    } catch(e) { /* fine — Spotify may not have a device active yet, single-URI play handles it */ }
  }

  // STEP 1: Play the single target track. Only one URI = nothing for shuffle to randomise.
  try {
    await api(endpoint, {
      method: 'PUT',
      body: JSON.stringify({ uris: [startUri], position_ms: 0 }),
    });
    console.log('[playPlaylist] started:', tracks[startIdx].name);
    if (isFirstVisit) localStorage.setItem('bt_visited', '1');
  } catch(e) {
    console.error('[playPlaylist] play call failed:', e);
    return;
  }

  // STEP 2: After playback is active, add the (pre-shuffled) tail to the queue.
  // Queue endpoint adds AFTER current track and is NOT affected by shuffle.
  setTimeout(async () => {
    for (const t of tail) {
      try {
        await api(`/me/player/queue?uri=${encodeURIComponent(t.uri)}&device_id=${deviceId}`, { method: 'POST' });
      } catch(e) { /* silent — don't block the user */ }
    }
    console.log('[playPlaylist] tail queued (' + tail.length + ' tracks)');
  }, 800);
}

// Check if we're approaching end of the current play window; if so, queue more.
// Called after each track change.
async function maybeExtendPlayback() {
  if (!tracks.length || !currentUri) return;
  const curIdx = tracks.findIndex(t => t.uri === currentUri);
  if (curIdx < 0) return;
  const windowEnd = playWindowStart + 100;
  // When user reaches the last 10 tracks of the current window, queue more
  if (curIdx >= windowEnd - 10 && windowEnd < tracks.length) {
    const nextBatch = tracks.slice(windowEnd, windowEnd + 50).map(t => t.uri);
    // Use Spotify's add-to-queue endpoint one at a time (no bulk endpoint exists)
    for (const uri of nextBatch) {
      try {
        await api(`/me/player/queue?uri=${encodeURIComponent(uri)}`, { method: 'POST' });
      } catch(e) { /* silent */ }
    }
    playWindowStart = windowEnd;
  }
}

// ─────────────────────────────────────────────
// Web Playback SDK init
// ─────────────────────────────────────────────
window.onSpotifyWebPlaybackSDKReady = async () => {
  const token = await getToken();
  if (!token) return;

  player = new Spotify.Player({
    name: 'Bedtime Tunes',
    getOAuthToken: async cb => { cb(await getToken()); },
    volume: 0.8,
  });

  player.addListener('ready', async ({ device_id }) => {
    deviceId = device_id;
    console.log('[player] ready, device_id=', device_id);
    // Transfer playback to this device
    try {
      await api('/me/player', {
        method: 'PUT',
        body: JSON.stringify({ device_ids: [device_id], play: false }),
      });
    } catch(e) { console.warn('[player] transfer failed:', e); }

    await fetchPlaylistTracks();
    showPlayer();
    checkSavedState();

    // Pre-load the upcoming track artwork so the player isn't blank.
    // But DO NOT auto-play — wait for the user to click play. This avoids
    // browser autoplay restrictions and unexpected music for visitors.
    const urlParams = new URLSearchParams(window.location.search);
    const sharedTrackId = urlParams.get('track');
    pendingStartUri = sharedTrackId ? `spotify:track:${sharedTrackId}` : null;

    // If a track is already playing on another device, sync to it.
    // Otherwise, show the first track's metadata as a preview but don't start audio.
    let alreadyPlaying = false;
    try {
      const cur = await api('/me/player');
      alreadyPlaying = cur && cur.is_playing;
    } catch(e) { /* no current state */ }

    if (!alreadyPlaying && tracks.length) {
      // Pre-fill the UI with the track that WILL play when they hit play
      let previewIdx = 0;
      if (pendingStartUri) {
        const i = tracks.findIndex(t => t.uri === pendingStartUri);
        if (i !== -1) previewIdx = i;
      } else if (!localStorage.getItem('bt_visited')) {
        previewIdx = Math.floor(Math.random() * tracks.length);
        // Remember for the actual play call (so it stays consistent)
        pendingStartUri = tracks[previewIdx].uri;
      } else {
        pendingStartUri = tracks[0].uri;
      }
      // Show that track's info in the UI without playing it
      updateTrackUI(tracks[previewIdx]);
      setPlaying(false);
    }
  });

  player.addListener('not_ready', () => console.log('Device offline'));

  player.addListener('player_state_changed', state => {
    if (!state) return;
    const item = state.track_window?.current_track;
    updateTrackUI(item);
    setPlaying(!state.paused);
    if (!state.paused) {
      startProgress(state.position, state.duration);
    } else {
      clearInterval(progressInterval);
      document.getElementById('progress-bar').value = state.position;
      document.getElementById('time-current').textContent = ms(state.position);
    }
    // Fade queue out immediately, clear after fade, refresh after debounce
    const qList = document.getElementById('queue-list');
    if (qList) qList.classList.add('fading');
    // Clear DOM after the fade completes so the swap isn't visible
    clearTimeout(window._queueClearTimer);
    window._queueClearTimer = setTimeout(() => {
      if (qList) qList.innerHTML = '';
    }, 500);
    clearTimeout(window._queueTimer);
    window._queueTimer = setTimeout(() => {
      refreshQueue();
      maybeExtendPlayback();
    }, 1200);
  });

  player.addListener('initialization_error', ({ message }) => showError(message));
  player.addListener('authentication_error',  ({ message }) => showError(message));
  player.addListener('account_error',         ({ message }) => showError('Spotify Premium required: ' + message));

  player.connect();
};

// ─────────────────────────────────────────────
// UI helpers
// ─────────────────────────────────────────────
let _loadingStateApplied = false;
function showPlayer() {
  document.getElementById('login-screen').style.display  = 'none';
  document.getElementById('player-screen').style.display = 'flex';
  // Only apply loading state on first call — don't re-apply after we've cleared it
  if (_loadingStateApplied) return;
  _loadingStateApplied = true;
  ['now-art-wrap','playlist-art','track-name','artist-name'].forEach(id => {
    document.getElementById(id)?.classList.add('shimmer');
  });
  document.getElementById('queue-list').classList.add('fading');
  document.querySelectorAll('#player-screen .glass-card').forEach(el => {
    el.classList.add('loading-pulse');
  });
}

function clearLoadingState() {
  ['now-art-wrap','playlist-art','track-name','artist-name'].forEach(id => {
    document.getElementById(id)?.classList.remove('shimmer');
  });
  document.querySelectorAll('.loading-pulse').forEach(el => el.classList.remove('loading-pulse'));
  // Mark it cleared so showPlayer doesn't re-add it
  _loadingStateApplied = true;
}
function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

// ─────────────────────────────────────────────
// Controls
// ─────────────────────────────────────────────
const shareData = {
  title: 'Bedtime Tunes',
  text: 'Tunes to snooze to — a curated bedtime playlist.',
  url: 'https://bedtimetunes.com/',
};

function buildTrackShareData() {
  if (!currentTrack) return null;
  const artists = currentTrack.artists.map(a => a.name).join(', ');
  const trackId = currentTrack.uri.split(':').pop();
  return {
    title: currentTrack.name,
    text: `♪ ${currentTrack.name} — ${artists} · heard on Bedtime Tunes`,
    url: `https://bedtimetunes.com/?track=${trackId}`,
  };
}

document.getElementById('btn-share-track').addEventListener('click', async () => {
  const data = buildTrackShareData();
  if (!data) return; // No track loaded yet
  if (navigator.share) {
    try {
      await navigator.share(data);
      return;
    } catch(e) {
      if (e.name === 'AbortError') return;
    }
  }
  // Desktop fallback — reuse the same menu but with track data temporarily swapped in
  openShareMenu(data);
});

// ── Save to Spotify (follow playlist) ──
async function checkSavedState() {
  try {
    const me = await api('/me');
    const data = await api(`/playlists/${PLAYLIST_ID}/followers/contains?ids=${me.id}`);
    const isSaved = Array.isArray(data) && data[0];
    document.getElementById('btn-save')?.classList.toggle('saved', !!isSaved);
  } catch(e) { /* silent */ }
}

document.getElementById('btn-save').addEventListener('click', async () => {
  const btn = document.getElementById('btn-save');
  const wasSaved = btn.classList.contains('saved');
  // Optimistic toggle
  btn.classList.toggle('saved');
  try {
    if (wasSaved) {
      await api(`/playlists/${PLAYLIST_ID}/followers`, { method: 'DELETE' });
    } else {
      await api(`/playlists/${PLAYLIST_ID}/followers`, {
        method: 'PUT',
        body: JSON.stringify({ public: true }),
      });
    }
  } catch(e) {
    // Revert on failure
    btn.classList.toggle('saved');
    console.error('[save] toggle failed', e);
  }
});

document.getElementById('btn-share').addEventListener('click', async () => {
  // Try native Web Share API first (mobile + some desktop browsers)
  if (navigator.share) {
    try {
      await navigator.share(shareData);
      return;
    } catch(e) {
      // User cancelled — silent
      if (e.name === 'AbortError') return;
    }
  }
  // Desktop fallback — open menu
  openShareMenu();
});

let activeShareData = shareData;

function openShareMenu(dataOverride) {
  activeShareData = dataOverride || shareData;
  let backdrop = document.querySelector('.share-backdrop');
  if (!backdrop) {
    backdrop = document.createElement('div');
    backdrop.className = 'share-backdrop';
    document.body.appendChild(backdrop);
    backdrop.addEventListener('click', closeShareMenu);
  }
  const menu = document.getElementById('share-menu');
  menu.hidden = false;
  requestAnimationFrame(() => {
    menu.classList.add('open');
    backdrop.classList.add('open');
  });
}

function closeShareMenu() {
  const menu = document.getElementById('share-menu');
  const backdrop = document.querySelector('.share-backdrop');
  menu.classList.remove('open');
  backdrop?.classList.remove('open');
  setTimeout(() => { menu.hidden = true; }, 250);
}

document.querySelectorAll('.share-opt').forEach(btn => {
  btn.addEventListener('click', async () => {
    const kind = btn.dataset.share;
    const data = activeShareData || shareData;
    const u = encodeURIComponent(data.url);
    const t = encodeURIComponent(data.text);
    let target;
    switch(kind) {
      case 'x':        target = `https://twitter.com/intent/tweet?text=${t}&url=${u}`; break;
      case 'bsky':     target = `https://bsky.app/intent/compose?text=${t}%20${u}`; break;
      case 'facebook': target = `https://www.facebook.com/sharer/sharer.php?u=${u}`; break;
      case 'whatsapp': target = `https://wa.me/?text=${t}%20${u}`; break;
      case 'email':    target = `mailto:?subject=${encodeURIComponent(data.title)}&body=${t}%20${u}`; break;
      case 'copy':
        try {
          await navigator.clipboard.writeText(data.url);
          btn.textContent = 'Link copied ✓';
          setTimeout(() => btn.textContent = 'Copy link', 1500);
        } catch(e) {}
        return;
    }
    if (target) window.open(target, '_blank', 'noopener');
    closeShareMenu();
  });
});

document.getElementById('login-btn').addEventListener('click', login);

document.getElementById('btn-play').addEventListener('click', async () => {
  if (!player) return;
  try {
    const state = await player.getCurrentState();
    // First play after page load — kick off playback from the pending track
    if (!state && pendingStartUri) {
      await playPlaylist(pendingStartUri);
      pendingStartUri = null;
      // Strip ?track= from URL once playback actually starts
      if (new URLSearchParams(window.location.search).get('track')) {
        history.replaceState({}, '', window.location.pathname);
      }
      return;
    }
    if (state?.paused) {
      await player.resume();
    } else {
      await player.pause();
    }
  } catch(e) {
    console.error('[play] click failed:', e);
    // Fallback: try a fresh playPlaylist
    if (pendingStartUri) {
      playPlaylist(pendingStartUri);
      pendingStartUri = null;
    } else {
      player.togglePlay();
    }
  }
});
document.getElementById('btn-next').addEventListener('click', () => player?.nextTrack());

document.getElementById('progress-bar').addEventListener('input', e => {
  clearInterval(progressInterval);
  player?.seek(+e.target.value).then(() => {
    document.getElementById('time-current').textContent = ms(+e.target.value);
  });
});

document.getElementById('volume-slider').addEventListener('input', e => {
  player?.setVolume(e.target.value / 100);
});

// ─────────────────────────────────────────────
// Boot: check for auth code in URL
// ─────────────────────────────────────────────
(async function boot() {
  const params = new URLSearchParams(window.location.search);
  const code   = params.get('code');
  const error  = params.get('error');

  // POPUP DETECTION: if we're a popup opened by another window AND we have auth params,
  // forward them to the parent and close immediately. Don't run the main flow.
  if (window.opener && window.opener !== window && (code || error)) {
    try {
      window.opener.postMessage({ type: 'bt-auth', code, error }, window.location.origin);
    } catch(e) { /* parent may have closed */ }
    window.close();
    return;
  }

  // Clear ONLY auth params from URL — preserve ?track= for shared links
  if (code || error) {
    const cleaned = new URLSearchParams(window.location.search);
    cleaned.delete('code');
    cleaned.delete('error');
    cleaned.delete('state');
    const query = cleaned.toString();
    history.replaceState({}, '', window.location.pathname + (query ? '?' + query : ''));
  }

  if (error) {
    showError('Spotify login cancelled.');
    sessionStorage.removeItem('pkce_verifier');
    return;
  }

  if (code) {
    // Show loading state immediately so the user has feedback during token exchange
    showPlayer();
    try {
      await exchangeCode(code);
      sessionStorage.removeItem('pkce_verifier'); // consumed
    } catch(e) {
      console.error('[boot] exchangeCode failed:', e);
      sessionStorage.removeItem('pkce_verifier');
      // Revert to login screen with error
      document.getElementById('player-screen').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      showError('Login failed. Try again.');
      return;
    }
  }

  const token = await getToken();
  if (!token) return; // Stay on login screen

  // Token exists — show player shell immediately, SDK loads in background
  showPlayer();
  loadSDK();
})();
</script>
