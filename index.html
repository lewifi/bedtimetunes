<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="A curated bedtime playlist running since 2006. Quiet music for falling asleep, beneath the aurora." />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/BT.png" />
  <link rel="apple-touch-icon" href="/BT.png" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Bedtime Tunes" />
  <meta property="og:title" content="Bedtime Tunes — tunes to snooze to" />
  <meta property="og:description" content="A curated bedtime playlist running since 2006. Quiet music for falling asleep, beneath the aurora." />
  <meta property="og:url" content="https://bedtimetunes.com/" />
  <meta property="og:image" content="https://bedtimetunes.com/bedtimetunes.jpg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Bedtime Tunes — tunes to snooze to" />
  <meta name="twitter:description" content="A curated bedtime playlist running since 2006. Quiet music for falling asleep, beneath the aurora." />
  <meta name="twitter:image" content="https://bedtimetunes.com/bedtimetunes.jpg" />

  <!-- Theme colour for mobile browsers -->
  <meta name="theme-color" content="#1a0a1e" />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XT56GW888D"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-XT56GW888D');</script>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Josefin+Sans:wght@100;200;300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --deep:    #1a0a1e;
      --plum:    #3d1a3a;
      --wine:    #7b2650;
      --rose:    #c2416b;
      --coral:   #e8735a;
      --gold:    #d4a847;
      --aurora1: #b03070;
      --aurora2: #8b1a6b;
      --aurora3: #c8506a;
      --aurora4: #e06050;
    }

    html, body {
      min-height: 100%;
      font-family: 'Josefin Sans', sans-serif;
      background: var(--deep);
      color: #fff;
      scrollbar-width: none;
    }

    /* ── Aurora Canvas ── */
    #aurora {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── Stars ── */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--d, 3s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }
    @keyframes twinkle {
      0%, 100% { opacity: var(--min-op, 0.1); transform: scale(1); }
      50%       { opacity: var(--max-op, 0.8); transform: scale(1.3); }
    }

    /* ── App Shell ── */
    #app {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── Login Screen ── */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      text-align: center;
      padding: 2rem;
      animation: fadeUp 1.2s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .playlist-cover {
      width: 180px;
      height: 180px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 0 60px rgba(192, 65, 107, 0.6), 0 0 120px rgba(192, 65, 107, 0.2);
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-12px); }
    }

    .title-block { line-height: 1; }
    .title-block h1 {
      font-family: 'Barlow', sans-serif;
      font-weight: 500;
      font-size: clamp(1.4rem, 3.8vw, 2rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
    }
    .title-block p {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-top: 0.5rem;
    }

    .btn-spotify {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.9rem 2.2rem;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #c2416b, #7b2650);
      color: #fff;
      box-shadow: 0 0 40px rgba(194, 65, 107, 0.5), 0 4px 20px rgba(0,0,0,0.4);
      transition: box-shadow 0.3s, transform 0.2s;
      position: relative;
      overflow: hidden;
    }
    .btn-spotify::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      border-radius: inherit;
    }
    .btn-spotify:hover {
      box-shadow: 0 0 70px rgba(194, 65, 107, 0.8), 0 4px 30px rgba(0,0,0,0.5);
      transform: translateY(-2px);
    }
    .btn-spotify svg { flex-shrink: 0; }

    .open-spotify-link {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      padding-bottom: 2px;
      transition: color 0.2s;
    }
    .open-spotify-link:hover { color: rgba(255,255,255,0.6); }

    /* ── Player Screen ── */
    #player-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 520px;
      padding: 1.5rem;
      gap: 1.2rem;
      animation: fadeUp 0.8s ease both;
    }

    .player-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      width: 100%;
      gap: 1rem;
    }
    .player-title {
      font-family: 'Barlow', sans-serif;
      font-weight: 500;
      font-size: 1rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .player-stats {
      font-family: 'Barlow', sans-serif;
      font-size: 0.5rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-top: 0.3rem;
    }
    .player-stats .sep {
      color: rgba(255,255,255,0.15);
      margin: 0 0.45em;
    }
    .playlist-link {
      font-size: 0.55rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.3em;
    }
    .playlist-link:hover { color: rgba(255,255,255,0.85); }

    /* Album art row */
    .art-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      width: 100%;
    }
    #playlist-art {
      width: min(190px, 42vw);
      height: min(190px, 42vw);
      border-radius: 10px;
      object-fit: cover;
      transition: box-shadow 0.6s, transform 0.4s;
      animation: float 8s ease-in-out infinite;
    }
    #now-art { object-fit: cover; }
    #now-art-wrap {
      width: min(190px, 42vw);
      height: min(190px, 42vw);
      border-radius: 10px;
      overflow: hidden;
      background: linear-gradient(135deg, #c2416b, #7b2650);
      box-shadow: 0 0 80px rgba(192, 65, 107, 0.5), 0 20px 60px rgba(0,0,0,0.6);
      animation: float 8s ease-in-out infinite;
      transition: box-shadow 0.6s;
    }
    #now-art-wrap.playing {
      box-shadow: 0 0 100px rgba(192, 65, 107, 0.7), 0 0 200px rgba(192, 65, 107, 0.2), 0 20px 60px rgba(0,0,0,0.6);
    }
    #now-art {
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #now-art.loaded { opacity: 1; }


    #playlist-art {
      box-shadow: 0 0 40px rgba(192, 65, 107, 0.25), 0 20px 40px rgba(0,0,0,0.5);
      opacity: 0.85;
      animation-delay: -3s;
    }

    /* Track info */
    .track-info { text-align: center; width: 100%; }
    #track-name {
      font-family: 'Barlow', sans-serif;
      font-weight: 500;
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-share-btn {
      margin-top: 0.6rem;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      padding: 0.3rem 0.7rem;
      cursor: pointer;
      font-family: 'Barlow', sans-serif;
      font-size: 0.5rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .track-share-btn:hover {
      color: rgba(255,255,255,0.85);
      border-color: rgba(194,65,107,0.45);
      background: rgba(194,65,107,0.1);
    }
    #artist-name {
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-top: 0.3rem;
    }

    /* Progress */
    .progress-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    #progress-bar {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.12);
      cursor: pointer;
      outline: none;
    }
    #progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #c2416b;
      box-shadow: 0 0 8px rgba(194,65,107,0.8);
      cursor: pointer;
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.35);
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 2rem;
    }
    .ctrl-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,0.5);
      transition: color 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
    }
    .ctrl-btn:hover { color: #fff; transform: scale(1.15); }
    .ctrl-btn.play-pause {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #c2416b, #7b2650);
      color: #fff;
      justify-content: center;
      box-shadow: 0 0 30px rgba(194,65,107,0.6);
      transition: box-shadow 0.3s, transform 0.15s;
    }
    .ctrl-btn.play-pause:hover {
      box-shadow: 0 0 50px rgba(194,65,107,0.9);
      transform: scale(1.08);
    }

    /* Volume */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      width: 100%;
    }
    .volume-row svg { color: rgba(255,255,255,0.4); flex-shrink: 0; }
    #volume-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.12);
      cursor: pointer;
      outline: none;
    }
    #volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.6);
      cursor: pointer;
    }

    /* Queue */
    .queue-section { width: 100%; }
    .queue-label {
      font-size: 0.55rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      margin-bottom: 0.6rem;
    }
    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      max-height: 60px;
      overflow-y: hidden;
      scrollbar-width: none;
      opacity: 1;
      transition: opacity 0.5s ease;
    }
    .queue-list.fading { opacity: 0; }
    .queue-list::-webkit-scrollbar { display: none; }
    .queue-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .queue-item:hover { background: rgba(255,255,255,0.06); }
    .queue-item.active { background: rgba(194,65,107,0.15); }
    .queue-thumb {
      width: 32px; height: 32px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .queue-meta { overflow: hidden; flex: 1; }
    .queue-track {
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .queue-artist {
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .queue-dur {
      font-size: 0.55rem;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.08em;
      flex-shrink: 0;
    }
    .adder-avatar {
      width: 20px; height: 20px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      opacity: 0.6;
    }
    .adder-initials {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: rgba(194,65,107,0.3);
      border: 1px solid rgba(194,65,107,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.45rem;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,0.5);
      flex-shrink: 0;
      text-transform: uppercase;
    }
    /* Error / Loading */
    .status-msg {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.4);
      text-align: center;
    }
    #error-msg {
      color: rgba(232,115,90,0.8);
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-align: center;
      display: none;
    }

    /* Loading pulse — applied to player surfaces until first track arrives */
    @keyframes pulse-load {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.25; }
    }
    .loading-pulse {
      animation: pulse-load 1.6s ease-in-out infinite;
    }

    /* Glassmorphism card for player */
    .glass-card {
      background: rgba(26, 10, 30, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 1.5rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* Shuffle button */
    /* Sort toggle */
    /* Shimmer loading */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position:  400px 0; }
    }
    .shimmer {
      background: linear-gradient(90deg,
        rgba(255,255,255,0.04) 25%,
        rgba(255,255,255,0.10) 50%,
        rgba(255,255,255,0.04) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.8s ease-in-out infinite;
      border-radius: 4px;
      color: transparent !important;
      pointer-events: none;
      user-select: none;
    }
    .shimmer * { visibility: hidden; }
    #now-art-wrap.shimmer, #playlist-art.shimmer {
      border-radius: 10px;
      background: linear-gradient(90deg,
        rgba(255,255,255,0.04) 25%,
        rgba(255,255,255,0.09) 50%,
        rgba(255,255,255,0.04) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.8s ease-in-out infinite;
    }


    /* Header actions */
    .header-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
    }
    .icon-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 100px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: rgba(255,255,255,0.5);
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .icon-btn:hover {
      color: #fff;
      border-color: rgba(194,65,107,0.4);
      background: rgba(194,65,107,0.08);
    }

    /* Share fallback menu — desktop browsers without Web Share API */
    .share-menu {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      z-index: 200;
      background: rgba(13, 5, 16, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      min-width: 220px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .share-menu.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    .share-menu[hidden] { display: none; }
    .share-opt {
      background: none;
      border: none;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Barlow', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      text-align: left;
      transition: background 0.15s, color 0.15s;
    }
    .share-opt:hover {
      background: rgba(194,65,107,0.15);
      color: #fff;
    }

    /* Backdrop for share menu */
    .share-backdrop {
      position: fixed;
      inset: 0;
      z-index: 199;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .share-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* Logo tooltip — quiet acknowledgement on hover/long-press */
    .logo-tooltip-wrap {
      position: relative;
      display: inline-block;
      line-height: 0;
    }
    .logo-tooltip {
      position: absolute;
      bottom: -2.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(-4px);
      background: rgba(13, 5, 16, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 0.5rem 0.9rem;
      border-radius: 100px;
      font-family: 'Barlow', sans-serif;
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 50;
      line-height: 1;
    }
    .logo-tooltip-wrap:hover .logo-tooltip,
    .logo-tooltip-wrap:focus-within .logo-tooltip,
    .logo-tooltip-wrap:active .logo-tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Footer */
    .site-footer {
      width: 100%;
      max-width: 520px;
      text-align: center;
      padding: 1.5rem 0 2.5rem;
      font-family: 'Barlow', sans-serif;
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .site-footer .version {
      font-size: 0.45rem;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.15);
    }
    .site-footer a {
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      padding-bottom: 1px;
      transition: color 0.2s, border-color 0.2s;
    }
    .site-footer a:hover {
      color: rgba(255,255,255,0.85);
      border-color: rgba(255,255,255,0.3);
    }

    /* Show playlist button */
    /* Playlist drawer */
  </style>
</head>
<body>

<canvas id="aurora"></canvas>

<div class="stars" id="stars"></div>

<div id="app">

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="logo-tooltip-wrap">
      <img class="playlist-cover" id="login-cover" src="./bedtimetunes.jpg" alt="Bedtime Tunes" style="background:linear-gradient(135deg,#3d1a3a,#c2416b);" />
      <span class="logo-tooltip">for you my friend &middot; Pedro &middot; Pit <span style="color:#c2416b">&hearts;</span></span>
    </div>
    <div class="title-block">
      <h1>Bedtime Tunes</h1>
      <p>tunes to snooze to</p>
    </div>

const CLIENT_ID      = 'e86a40e7f7704f33a1ceaffc9e2d16b7';

const SCOPES         = [

(function initAurora() {
  const canvas = document.getElementById('aurora');
  const ctx    = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();

  // Expanded palette with more orange tones and a vivid focal orb.
  const orbs = [
    // rose / pink
    { r:[194, 65,107], xP:0.25, yP:0.30, rW:0.65, rH:0.50, alpha:0.30, alphaA:0.12, sxA:0.18, syA:0.12, sxF:0.00009 , syF:0.00007 , sxO:0.0 , syO:1.1, aF:0.00011, aO:0.3 },
    // deep magenta
    { r:[139, 26,107], xP:0.65, yP:0.55, rW:0.70, rH:0.55, alpha:0.26, alphaA:0.10, sxA:0.20, syA:0.14, sxF:0.00008 , syF:0.00009 , sxO:2.4 , syO:0.7, aF:0.00013, aO:1.2 },
    // violet
    { r:[110, 60,180], xP:0.40, yP:0.18, rW:0.60, rH:0.45, alpha:0.20, alphaA:0.12, sxA:0.22, syA:0.16, sxF:0.00010 , syF:0.00007 , sxO:4.7 , syO:3.2, aF:0.00015, aO:2.1 },
    // electric blue
    { r:[ 60,100,200], xP:0.82, yP:0.40, rW:0.55, rH:0.42, alpha:0.18, alphaA:0.10, sxA:0.20, syA:0.13, sxF:0.00007 , syF:0.00011 , sxO:1.8 , syO:5.0, aF:0.00012, aO:0.8 },
    // burnt orange
    { r:[235,120, 70], xP:0.15, yP:0.65, rW:0.65, rH:0.50, alpha:0.32, alphaA:0.14, sxA:0.18, syA:0.14, sxF:0.00012 , syF:0.00009 , sxO:3.3 , syO:2.1, aF:0.00010, aO:3.4 },
    // VIVID ORANGE — the showpiece orb
    { r:[255,110, 40], xP:0.35, yP:0.45, rW:0.55, rH:0.42, alpha:0.55, alphaA:0.18, sxA:0.22, syA:0.16, sxF:0.00014 , syF:0.00010 , sxO:1.5 , syO:4.2, aF:0.00018, aO:2.8 },
    // amber gold
    { r:[245,170, 80], xP:0.55, yP:0.78, rW:0.55, rH:0.42, alpha:0.24, alphaA:0.12, sxA:0.16, syA:0.18, sxF:0.00011 , syF:0.00008 , sxO:5.6 , syO:4.4, aF:0.00014, aO:1.7 },
    // warm red
    { r:[215, 60, 70], xP:0.75, yP:0.85, rW:0.50, rH:0.40, alpha:0.22, alphaA:0.10, sxA:0.15, syA:0.18, sxF:0.00009 , syF:0.00008 , sxO:5.0 , syO:3.7, aF:0.00014, aO:5.2 },
    // soft coral highlight
    { r:[255,140,100], xP:0.50, yP:0.50, rW:0.40, rH:0.32, alpha:0.16, alphaA:0.10, sxA:0.20, syA:0.16, sxF:0.00013 , syF:0.00010 , sxO:0.9 , syO:6.0, aF:0.00016, aO:4.7 },
  ];

  // Curtain waves — vertical ripple bands layered on top of orbs.
  const curtains = [
    { color:[200, 80,130], yCenter:0.32, height:0.28, alpha:0.45, waveAmp:0.10, waveFreq:0.0028, waveSpeed: 0.00018, shimmerFreq:0.0012, shimmerAmp:0.025, shimmerSpeed: 0.00040, phase:0   },
    { color:[240,130, 80], yCenter:0.52, height:0.24, alpha:0.38, waveAmp:0.08, waveFreq:0.0024, waveSpeed:-0.00014, shimmerFreq:0.0015, shimmerAmp:0.022, shimmerSpeed:-0.00045, phase:1.7 },
    { color:[220, 90, 90], yCenter:0.70, height:0.22, alpha:0.32, waveAmp:0.07, waveFreq:0.0020, waveSpeed: 0.00012, shimmerFreq:0.0010, shimmerAmp:0.018, shimmerSpeed: 0.00035, phase:3.4 },
  ];

  // Draw a single soft radial orb.
  // We use a large radial gradient that falls to 0 alpha at the edge —
  // no hard boundary, just an infinite feather.
  function drawOrb(o, t) {
    const cx = W * (o.xP + Math.sin(t * o.sxF + o.sxO) * o.sxA);
    const cy = H * (o.yP + Math.sin(t * o.syF + o.syO) * o.syA);
    const rx = W * o.rW;
    const ry = H * o.rH;
    const [r,g,b] = o.r;
    // Breathing alpha — each orb pulses brightness independently
    const a = Math.max(0, o.alpha + Math.sin(t * o.aF + o.aO) * (o.alphaA || 0));

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, ry / rx);
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    grad.addColorStop(0.00, `rgba(${r},${g},${b},${a.toFixed(3)})`);
    grad.addColorStop(0.35, `rgba(${r},${g},${b},${(a * 0.6).toFixed(3)})`);
    grad.addColorStop(0.65, `rgba(${r},${g},${b},${(a * 0.18).toFixed(3)})`);
    grad.addColorStop(1.00, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, rx, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawCurtain(c, t) {
    const yC      = H * c.yCenter;
    const halfH   = H * c.height * 0.5;
    const ampPx   = H * c.waveAmp;
    const shimAmp = H * c.shimmerAmp;
    const [r,g,b] = c.color;

    ctx.beginPath();
    const step = 6;
    for (let x = 0; x <= W + step; x += step) {
      const wave =
        Math.sin(x * c.waveFreq    + t * c.waveSpeed    + c.phase) * ampPx +
        Math.sin(x * c.shimmerFreq + t * c.shimmerSpeed + c.phase * 0.7) * shimAmp;
      const y = yC + wave - halfH;
      if (x === 0) ctx.moveTo(x, y);
      else         ctx.lineTo(x, y);
    }
    for (let x = W; x >= -step; x -= step) {
      const wave =
        Math.sin(x * c.waveFreq    + t * c.waveSpeed    + c.phase + 0.4) * ampPx +
        Math.sin(x * c.shimmerFreq + t * c.shimmerSpeed + c.phase * 0.7 + 0.6) * shimAmp;
      const y = yC + wave + halfH;
      ctx.lineTo(x, y);
    }
    ctx.closePath();

    const grad = ctx.createLinearGradient(0, yC - halfH * 1.5, 0, yC + halfH * 1.5);
    grad.addColorStop(0.00, `rgba(${r},${g},${b},0)`);
    grad.addColorStop(0.40, `rgba(${r},${g},${b},${c.alpha.toFixed(3)})`);
    grad.addColorStop(0.60, `rgba(${r},${g},${b},${c.alpha.toFixed(3)})`);
    grad.addColorStop(1.00, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.fill();
  }

  let rafId;
  function frame(ts) {
    ctx.clearRect(0, 0, W, H);
    const bg = ctx.createRadialGradient(W*0.5, H*0.38, 0, W*0.5, H*0.38, H);
    bg.addColorStop(0,   '#28102e');
    bg.addColorStop(0.6, '#1a0a22');
    bg.addColorStop(1,   '#0b0410');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    orbs.forEach(o => drawOrb(o, ts));
    curtains.forEach(c => drawCurtain(c, ts));
    ctx.globalCompositeOperation = 'source-over';
    rafId = requestAnimationFrame(frame);
  }
  rafId = requestAnimationFrame(frame);

  // Pause animation when tab is hidden — saves CPU + battery
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      cancelAnimationFrame(rafId);
    } else {
      rafId = requestAnimationFrame(frame);
    }
  });

  // Debounce resize so we don't recalculate on every pixel
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 100);
  });
})();

// ─────────────────────────────────────────────
// Auth (PKCE)
// ─────────────────────────────────────────────
function base64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function generatePKCE() {
  const verifier  = base64url(crypto.getRandomValues(new Uint8Array(32)));
  const challenge = base64url(await crypto.subtle.digest('SHA-256',
    new TextEncoder().encode(verifier)));
  return { verifier, challenge };
}

async function login() {
  // Visual feedback that something is happening
  const btn = document.getElementById('login-btn');
  if (btn) {
    btn.style.opacity = '0.6';
    btn.style.pointerEvents = 'none';
    btn.textContent = 'opening spotify…';
  }
  const { verifier, challenge } = await generatePKCE();
  sessionStorage.setItem('pkce_verifier', verifier);
  const url = new URL('https://accounts.spotify.com/authorize');
  url.searchParams.set('client_id',             CLIENT_ID);
  url.searchParams.set('response_type',         'code');
  url.searchParams.set('redirect_uri',          REDIRECT_URI);
  url.searchParams.set('scope',                 SCOPES);
  url.searchParams.set('code_challenge_method', 'S256');
  url.searchParams.set('code_challenge',        challenge);

  // Try popup first; fall back to redirect if blocked
  const w = 480, h = 640;
  const left = Math.round(screen.width  / 2 - w / 2);
  const top  = Math.round(screen.height / 2 - h / 2);
  const popup = window.open(url.toString(), 'spotify-login',
    `width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes`);

  if (!popup || popup.closed || typeof popup.closed === 'undefined') {
    // Popup blocked — fall back to full redirect
    window.location = url.toString();
    return;
  }

  // Show loading state immediately when popup opens, so the UI doesn't sit blank
  showPlayer();

  // Poll for popup to land on our redirect URI
  let captured = false;
  const poll = setInterval(async () => {
    if (captured) return;

    // Try to read the popup URL — only succeeds when popup is on our origin
    let popupUrl = null;
    try { popupUrl = popup.location.href; } catch(e) { /* cross-origin, ignore */ }

    if (popupUrl && popupUrl.startsWith(REDIRECT_URI)) {
      captured = true;
      clearInterval(poll);
      const params = new URLSearchParams(new URL(popupUrl).search);
      popup.close();
      const code = params.get('code');
      const popupError = params.get('error');
      if (code) {
        try {
          await exchangeCode(code);
          loadSDK();
        } catch(e) {
          showError('Login failed. Try again.');
          resetLoginUI();
        }
      } else if (popupError) {
        showError('Login cancelled.');
        resetLoginUI();
      } else {
        showError('Login failed. Try again.');
        resetLoginUI();
      }
      return;
    }

    // Popup was closed by user without completing auth
    if (popup.closed && !captured) {
      clearInterval(poll);
      // Give one last beat in case URL change + close happened simultaneously
      setTimeout(() => {
        if (!captured) {
          showError('Login cancelled.');
          resetLoginUI();
        }
      }, 500);
    }
  }, 250);
}

function resetLoginUI() {
  // Revert to the login screen so user can try again
  document.getElementById('player-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  const btn = document.getElementById('login-btn');
  if (btn) {
    btn.style.opacity = '';
    btn.style.pointerEvents = '';
    btn.innerHTML = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.51 17.314a.748.748 0 01-1.03.249c-2.82-1.723-6.369-2.112-10.547-1.157a.748.748 0 01-.354-1.453c4.574-1.047 8.496-.596 11.682 1.337a.748.748 0 01.249 1.024zm1.47-3.27a.936.936 0 01-1.287.308c-3.226-1.982-8.144-2.556-11.96-1.399a.937.937 0 01-.545-1.791c4.358-1.322 9.775-.681 13.484 1.594a.937.937 0 01.308 1.288zm.126-3.405c-3.868-2.297-10.248-2.508-13.939-1.387a1.124 1.124 0 01-.653-2.151c4.239-1.287 11.284-1.038 15.738 1.605a1.124 1.124 0 01-1.146 1.933z"/>
      </svg>
      Sign in with Spotify
    `;
  }
}

function loadSDK() {
  if (window.Spotify) {
    window.onSpotifyWebPlaybackSDKReady();
    return;
  }
  const s = document.createElement('script');
  s.src = 'https://sdk.scdn.co/spotify-player.js';
  document.head.appendChild(s);
}

async function exchangeCode(code) {
  const verifier = sessionStorage.getItem('pkce_verifier');
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type:    'authorization_code',
      code,
      redirect_uri:  REDIRECT_URI,
      client_id:     CLIENT_ID,
      code_verifier: verifier,
    }),
  });
  if (!res.ok) throw new Error('Token exchange failed');
  const data = await res.json();
  storeTokens(data);
  return data.access_token;
}

async function refreshToken() {
  const rt = localStorage.getItem('sp_refresh');
  if (!rt) return null;
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type:    'refresh_token',
      refresh_token: rt,
      client_id:     CLIENT_ID,
    }),
  });
  if (!res.ok) return null;
  const data = await res.json();
  storeTokens(data);
  return data.access_token;
}

function storeTokens(data) {
  localStorage.setItem('sp_access',  data.access_token);
  localStorage.setItem('sp_refresh', data.refresh_token || localStorage.getItem('sp_refresh'));
  localStorage.setItem('sp_expiry',  Date.now() + data.expires_in * 1000);
}

async function getToken() {
  const expiry = +localStorage.getItem('sp_expiry') || 0;
  if (Date.now() < expiry - 60000) return localStorage.getItem('sp_access');
  return await refreshToken();
}

// ─────────────────────────────────────────────
// Spotify API helpers
// ─────────────────────────────────────────────
async function api(path, opts = {}) {
  const token = await getToken();
  const res = await fetch('https://api.spotify.com/v1' + path, {
    ...opts,
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  if (res.status === 204) return null;
  if (!res.ok) throw new Error(await res.text());
  // Some endpoints return empty/text bodies — try JSON, fall back gracefully
  const text = await res.text();
  if (!text) return null;
  try { return JSON.parse(text); } catch(e) { return null; }
}

// ─────────────────────────────────────────────
// Player state
// ─────────────────────────────────────────────
let player, deviceId;
let tracks = [], trackItems = [], currentUri = null;
let progressInterval;

function ms(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

function setPlaying(playing) {
  document.getElementById('icon-play').style.display  = playing ? 'none' : '';
  document.getElementById('icon-pause').style.display = playing ? ''     : 'none';
  document.getElementById('now-art-wrap')?.classList.toggle('playing', playing);
}

let currentTrack = null;
function updateTrackUI(item) {
  if (!item) return;
  currentUri = item.uri;
  currentTrack = item;
  document.getElementById('track-name').textContent  = item.name;
  document.getElementById('artist-name').textContent = item.artists.map(a=>a.name).join(', ');
  const art = item.album?.images?.[0]?.url;
  if (art) {
    const artEl = document.getElementById('now-art');
    artEl.onload = () => artEl.classList.add('loaded');
    artEl.src = art;
  }
  document.getElementById('time-total').textContent  = ms(item.duration_ms);
  // Remove shimmer + pulse now that we have real data
  ['now-art-wrap','playlist-art','track-name','artist-name'].forEach(id => {
    document.getElementById(id)?.classList.remove('shimmer');
  });
  document.querySelectorAll('.loading-pulse').forEach(el => el.classList.remove('loading-pulse'));
  highlightQueue(item.uri);
  // highlightQueue already updates the active class on existing rows --
  // no need to re-render the full list (which would reset pagination).
}

function highlightQueue(uri) {
  document.querySelectorAll('.queue-item, .full-track-item').forEach(el => {
    el.classList.toggle('active', el.dataset.uri === uri);
  });
}

function startProgress(position, duration) {
  clearInterval(progressInterval);
  const bar = document.getElementById('progress-bar');
  const cur = document.getElementById('time-current');
  let pos = position;
  bar.max = duration;
  bar.value = pos;
  cur.textContent = ms(pos);
  progressInterval = setInterval(() => {
    pos += 1000;
    if (pos > duration) { clearInterval(progressInterval); return; }
    bar.value = pos;
    cur.textContent = ms(pos);
  }, 1000);
}

// ─────────────────────────────────────────────
// Queue / playlist fetch
// ─────────────────────────────────────────────
const PLAYLIST_CACHE_KEY = 'bt_playlist_cache_v1';
const PLAYLIST_CACHE_TTL = 10 * 60 * 1000; // 10 minutes

function readPlaylistCache() {
  try {
    const raw = localStorage.getItem(PLAYLIST_CACHE_KEY);
    if (!raw) return null;
    const { ts, data } = JSON.parse(raw);
    if (Date.now() - ts > PLAYLIST_CACHE_TTL) return null;
    return data;
  } catch(e) { return null; }
}

function writePlaylistCache(data) {
  try {
    localStorage.setItem(PLAYLIST_CACHE_KEY, JSON.stringify({ ts: Date.now(), data }));
  } catch(e) { /* quota exceeded — silent */ }
}

async function fetchPlaylistTracks() {
  // Try cache first for instant render
  const cached = readPlaylistCache();
  if (cached) {
    console.log('[cache] using cached playlist (' + cached.tracks.length + ' tracks)');
    tracks = cached.tracks;
    trackItems = cached.tracks;
    if (cached.coverImg) {
      const el = document.getElementById('login-cover');
      if (el) el.src = cached.coverImg;
    }
    if (cached.stats) renderStats(cached.stats);
    renderQueue();
    // Refresh in background — silently update if changed
    setTimeout(() => fetchPlaylistTracksFresh(), 1500);
    return;
  }
  return fetchPlaylistTracksFresh();
}

async function fetchPlaylistTracksFresh() {
  const playlistMetaPromise = api(`/playlists/${PLAYLIST_ID}?fields=images,tracks(total),followers(total)`);
  const allRaw = [];
  let offset = 0;
  const pageSize = 100;
  while (true) {
    const page = await api(
      `/playlists/${PLAYLIST_ID}/tracks?limit=${pageSize}&offset=${offset}&fields=items(added_by(id),track(uri,name,duration_ms,artists(name),album(images))),next`
    );
    const items = (page?.items || []).filter(i => i.track);
    allRaw.push(...items);
    if (!page?.next) break;
    offset += pageSize;
    // Safety cap so we never spin forever
    if (offset > 10000) break;
  }

  // Collect unique user IDs (cap at first 50 to avoid hammering API)
  const userIds = [...new Set(allRaw.map(i => i.added_by?.id).filter(Boolean))].slice(0, 50);
  const profileMap = {};
  await Promise.all(userIds.map(async id => {
    try {
      const u = await api(`/users/${id}`);
      profileMap[id] = { name: u.display_name || id, img: u.images?.[0]?.url || null };
    } catch(e) {
      profileMap[id] = { name: id, img: null };
    }
  }));

  // Attach adder info; reverse for newest-first default
  trackItems = allRaw.map(i => ({
    ...i.track,
    adder: profileMap[i.added_by?.id] || null,
  })).reverse();

  tracks = trackItems;

  const playlistData = await playlistMetaPromise;
  const coverImg = playlistData?.images?.[0]?.url;
  if (coverImg) {
    const el = document.getElementById('login-cover');
    if (el) el.src = coverImg;
  }
  // Compute stats
  const totalMs = trackItems.reduce((s, t) => s + (t.duration_ms || 0), 0);
  const totalHours = Math.round(totalMs / 1000 / 60 / 60);
  const contributors = new Set(allRaw.map(i => i.added_by?.id).filter(Boolean)).size;
  const followers = playlistData?.followers?.total || 0;
  const stats = { totalHours, contributors, followers, trackCount: trackItems.length };

  // Cache for next page load (now includes stats)
  writePlaylistCache({ tracks: trackItems, coverImg, stats });
  renderStats(stats);
  renderQueue();
}

function renderStats(s) {
  if (!s) return;
  const fmt = n => n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/, '') + 'k' : n;
  const parts = [
    'since 2006',
    `${s.trackCount} tracks`,
    `${s.totalHours} hours`,
    `${s.contributors} contributors`,
  ];
  if (s.followers > 0) parts.push(`${fmt(s.followers)} saved`);
  const el = document.getElementById('player-stats');
  if (el) el.innerHTML = parts.join('<span class="sep">·</span>');
}

function adderAvatar(adder, cls, initialsCls) {
  if (!adder) return ''; // show nothing if no adder info
  if (adder.img) return `<img class="${cls}" src="${adder.img}" alt="${adder.name}" title="Added by ${adder.name}" loading="lazy" decoding="async" />`;
  const initials = adder.name.split(' ').map(w=>w[0]).join('').slice(0,2);
  return `<div class="${initialsCls}" title="Added by ${adder.name}">${initials}</div>`;
}

function renderQueueItems(items) {
  const list = document.getElementById('queue-list');
  if (!list) return;
  list.innerHTML = '';
  items.forEach(t => {
    const el = document.createElement('div');
    el.className = 'queue-item';
    el.dataset.uri = t.uri;
    const thumb = t.album?.images?.[1]?.url || t.album?.images?.[0]?.url || '';
    // Try to find adder from our local tracks data
    const localTrack = tracks.find(lt => lt.uri === t.uri);
    el.innerHTML = `
      <img class="queue-thumb" src="${thumb}" alt="" loading="lazy" decoding="async" />
      <div class="queue-meta">
        <div class="queue-track">${t.name}</div>
        <div class="queue-artist">${t.artists.map(a=>a.name).join(', ')}</div>
      </div>
      ${adderAvatar(localTrack?.adder || null, 'adder-avatar', 'adder-initials')}
      <div class="queue-dur">${ms(t.duration_ms)}</div>
    `;
    el.addEventListener('click', () => player?.nextTrack());
    list.appendChild(el);
  });
}

async function refreshQueue() {
  const list = document.getElementById('queue-list');
  try {
    const queueData = await api('/me/player/queue');
    if (queueData?.queue?.length) {
      renderQueueItems(queueData.queue.slice(0, 1));
    } else if (tracks.length) {
      const idx = currentUri ? tracks.findIndex(t => t.uri === currentUri) : -1;
      const upcoming = tracks.slice(idx + 1, idx + 2);
      renderQueueItems(upcoming.length ? upcoming : tracks.slice(0, 1));
    }
  } catch(e) {}
  if (list) list.classList.remove('fading');
}

function renderQueue() {
  const idx = currentUri ? tracks.findIndex(t => t.uri === currentUri) : -1;
  const upcoming = tracks.slice(idx + 1, idx + 6);
  renderQueueItems(upcoming.length ? upcoming.slice(0, 1) : tracks.slice(0, 1));
}

let playWindowStart = 0; // index into tracks where current chunk began

async function playPlaylist() {
  if (!tracks.length) return;

  // First-visit: start from a random track. Subsequent visits: resume naturally.
  const isFirstVisit = !localStorage.getItem('bt_visited');
  let startIdx = 0;
  if (isFirstVisit) {
    startIdx = Math.floor(Math.random() * tracks.length);
    localStorage.setItem('bt_visited', '1');
    console.log('[playPlaylist] first visit — starting at random index', startIdx);
  }

  // Send up to 100 tracks starting at startIdx
  const uris = tracks.slice(startIdx, startIdx + 100).map(t => t.uri);
  // If we didn't get 100 because we're near the end, wrap around for variety
  if (uris.length < 100 && tracks.length > 100) {
    uris.push(...tracks.slice(0, 100 - uris.length).map(t => t.uri));
  }
  playWindowStart = startIdx;

  // Turn shuffle off briefly so Spotify accepts the fresh uris[] order,
  // then turn it back on for randomised playback.
  try { await api(`/me/player/shuffle?state=false`, { method: 'PUT' }); } catch(e){}
  const endpoint = deviceId ? `/me/player/play?device_id=${deviceId}` : '/me/player/play';
  await api(endpoint, {
    method: 'PUT',
    body: JSON.stringify({ uris, position_ms: 0 }),
  });
  setTimeout(async () => {
    try { await api(`/me/player/shuffle?state=true`, { method: 'PUT' }); } catch(e){}
  }, 500);
}

// Check if we're approaching end of the current play window; if so, queue more.
// Called after each track change.
async function maybeExtendPlayback() {
  if (!tracks.length || !currentUri) return;
  const curIdx = tracks.findIndex(t => t.uri === currentUri);
  if (curIdx < 0) return;
  const windowEnd = playWindowStart + 100;
  // When user reaches the last 10 tracks of the current window, queue more
  if (curIdx >= windowEnd - 10 && windowEnd < tracks.length) {
    const nextBatch = tracks.slice(windowEnd, windowEnd + 50).map(t => t.uri);
    // Use Spotify's add-to-queue endpoint one at a time (no bulk endpoint exists)
    for (const uri of nextBatch) {
      try {
        await api(`/me/player/queue?uri=${encodeURIComponent(uri)}`, { method: 'POST' });
      } catch(e) { /* silent */ }
    }
    playWindowStart = windowEnd;
  }
}

// ─────────────────────────────────────────────
// Web Playback SDK init
// ─────────────────────────────────────────────
window.onSpotifyWebPlaybackSDKReady = async () => {
  const token = await getToken();
  if (!token) return;

  player = new Spotify.Player({
    name: 'Bedtime Tunes',
    getOAuthToken: async cb => { cb(await getToken()); },
    volume: 0.8,
  });

  player.addListener('ready', async ({ device_id }) => {
    deviceId = device_id;
    // Transfer playback to this device
    await api('/me/player', {
      method: 'PUT',
      body: JSON.stringify({ device_ids: [device_id], play: false }),
    });
    await fetchPlaylistTracks();
    showPlayer();
    // Always shuffle
    try { await api(`/me/player/shuffle?state=true`, { method: 'PUT' }); } catch(e){}
    // First visit: random start. Returning visit: try to resume what they had.
    const isFirstVisit = !localStorage.getItem('bt_visited');
    if (isFirstVisit) {
      await playPlaylist();
    } else {
      // Try to resume — if Spotify has no recent state, fall back to playlist start
      try {
        const cur = await api('/me/player');
        if (!cur || !cur.is_playing) {
          // Either no playback or paused — start the playlist
          await playPlaylist();
        }
        // Else Spotify is already playing somewhere; player_state_changed will sync us
      } catch(e) {
        await playPlaylist();
      }
    }
  });

  player.addListener('not_ready', () => console.log('Device offline'));

  player.addListener('player_state_changed', state => {
    if (!state) return;
    const item = state.track_window?.current_track;
    updateTrackUI(item);
    setPlaying(!state.paused);
    if (!state.paused) {
      startProgress(state.position, state.duration);
    } else {
      clearInterval(progressInterval);
      document.getElementById('progress-bar').value = state.position;
      document.getElementById('time-current').textContent = ms(state.position);
    }
    // Fade queue out immediately, clear after fade, refresh after debounce
    const qList = document.getElementById('queue-list');
    if (qList) qList.classList.add('fading');
    // Clear DOM after the fade completes so the swap isn't visible
    clearTimeout(window._queueClearTimer);
    window._queueClearTimer = setTimeout(() => {
      if (qList) qList.innerHTML = '';
    }, 500);
    clearTimeout(window._queueTimer);
    window._queueTimer = setTimeout(() => {
      refreshQueue();
      maybeExtendPlayback();
    }, 1200);
  });

  player.addListener('initialization_error', ({ message }) => showError(message));
  player.addListener('authentication_error',  ({ message }) => showError(message));
  player.addListener('account_error',         ({ message }) => showError('Spotify Premium required: ' + message));

  player.connect();
};

// ─────────────────────────────────────────────
// UI helpers
// ─────────────────────────────────────────────
function showPlayer() {
  document.getElementById('login-screen').style.display  = 'none';
  document.getElementById('player-screen').style.display = 'flex';
  // Add shimmer to track info + artwork
  ['now-art-wrap','playlist-art','track-name','artist-name'].forEach(id => {
    document.getElementById(id)?.classList.add('shimmer');
  });
  document.getElementById('queue-list').classList.add('fading');
  // Pulse the glass-card backgrounds + show-playlist button while loading
  document.querySelectorAll('#player-screen .glass-card').forEach(el => {
    el.classList.add('loading-pulse');
  });
}
function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

// ─────────────────────────────────────────────
// Controls
// ─────────────────────────────────────────────
const shareData = {
  title: 'Bedtime Tunes',
  text: 'Tunes to snooze to — a curated bedtime playlist.',
  url: 'https://bedtimetunes.com/',
};

function buildTrackShareData() {
  if (!currentTrack) return null;
  const artists = currentTrack.artists.map(a => a.name).join(', ');
  // Spotify track URIs are spotify:track:ID — convert to open.spotify.com URL
  const trackId = currentTrack.uri.split(':').pop();
  return {
    title: currentTrack.name,
    text: `♪ ${currentTrack.name} — ${artists} · heard on Bedtime Tunes`,
    url: `https://open.spotify.com/track/${trackId}`,
  };
}

document.getElementById('btn-share-track').addEventListener('click', async () => {
  const data = buildTrackShareData();
  if (!data) return; // No track loaded yet
  if (navigator.share) {
    try {
      await navigator.share(data);
      return;
    } catch(e) {
      if (e.name === 'AbortError') return;
    }
  }
  // Desktop fallback — reuse the same menu but with track data temporarily swapped in
  openShareMenu(data);
});

document.getElementById('btn-share').addEventListener('click', async () => {
  // Try native Web Share API first (mobile + some desktop browsers)
  if (navigator.share) {
    try {
      await navigator.share(shareData);
      return;
    } catch(e) {
      // User cancelled — silent
      if (e.name === 'AbortError') return;
    }
  }
  // Desktop fallback — open menu
  openShareMenu();
});

let activeShareData = shareData;

function openShareMenu(dataOverride) {
  activeShareData = dataOverride || shareData;
  let backdrop = document.querySelector('.share-backdrop');
  if (!backdrop) {
    backdrop = document.createElement('div');
    backdrop.className = 'share-backdrop';
    document.body.appendChild(backdrop);
    backdrop.addEventListener('click', closeShareMenu);
  }
  const menu = document.getElementById('share-menu');
  menu.hidden = false;
  requestAnimationFrame(() => {
    menu.classList.add('open');
    backdrop.classList.add('open');
  });
}

function closeShareMenu() {
  const menu = document.getElementById('share-menu');
  const backdrop = document.querySelector('.share-backdrop');
  menu.classList.remove('open');
  backdrop?.classList.remove('open');
  setTimeout(() => { menu.hidden = true; }, 250);
}

document.querySelectorAll('.share-opt').forEach(btn => {
  btn.addEventListener('click', async () => {
    const kind = btn.dataset.share;
    const data = activeShareData || shareData;
    const u = encodeURIComponent(data.url);
    const t = encodeURIComponent(data.text);
    let target;
    switch(kind) {
      case 'x':        target = `https://twitter.com/intent/tweet?text=${t}&url=${u}`; break;
      case 'bsky':     target = `https://bsky.app/intent/compose?text=${t}%20${u}`; break;
      case 'facebook': target = `https://www.facebook.com/sharer/sharer.php?u=${u}`; break;
      case 'whatsapp': target = `https://wa.me/?text=${t}%20${u}`; break;
      case 'email':    target = `mailto:?subject=${encodeURIComponent(data.title)}&body=${t}%20${u}`; break;
      case 'copy':
        try {
          await navigator.clipboard.writeText(data.url);
          btn.textContent = 'Link copied ✓';
          setTimeout(() => btn.textContent = 'Copy link', 1500);
        } catch(e) {}
        return;
    }
    if (target) window.open(target, '_blank', 'noopener');
    closeShareMenu();
  });
});

document.getElementById('login-btn').addEventListener('click', login);

document.getElementById('btn-play').addEventListener('click', () => player?.togglePlay());
document.getElementById('btn-next').addEventListener('click', () => player?.nextTrack());

document.getElementById('progress-bar').addEventListener('input', e => {
  clearInterval(progressInterval);
  player?.seek(+e.target.value).then(() => {
    document.getElementById('time-current').textContent = ms(+e.target.value);
  });
});

document.getElementById('volume-slider').addEventListener('input', e => {
  player?.setVolume(e.target.value / 100);
});

// ─────────────────────────────────────────────
// Boot: check for auth code in URL
// ─────────────────────────────────────────────
(async function boot() {
  const params = new URLSearchParams(window.location.search);
  const code   = params.get('code');
  const error  = params.get('error');

  if (error) { showError('Spotify login cancelled.'); return; }

  if (code) {
    history.replaceState({}, '', window.location.pathname);
    try {
      await exchangeCode(code);
    } catch(e) {
      showError('Login failed. Try again.');
      return;
    }
  }

  const token = await getToken();
  if (!token) return; // Stay on login screen

  // Token exists — show player shell immediately, SDK loads in background
  showPlayer();
  loadSDK();
})();
</script>
