<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bedtime Tunes</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XT56GW888D"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-XT56GW888D');</script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Josefin+Sans:wght@100;200;300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --deep:    #1a0a1e;
      --plum:    #3d1a3a;
      --wine:    #7b2650;
      --rose:    #c2416b;
      --coral:   #e8735a;
      --gold:    #d4a847;
      --aurora1: #b03070;
      --aurora2: #8b1a6b;
      --aurora3: #c8506a;
      --aurora4: #e06050;
    }

    html, body {
      min-height: 100%;
      font-family: 'Josefin Sans', sans-serif;
      background: var(--deep);
      color: #fff;
      scrollbar-width: none;
    }

    /* ── Aurora Canvas ── */
    #aurora {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── Stars ── */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--d, 3s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }
    @keyframes twinkle {
      0%, 100% { opacity: var(--min-op, 0.1); transform: scale(1); }
      50%       { opacity: var(--max-op, 0.8); transform: scale(1.3); }
    }

    /* ── App Shell ── */
    #app {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── Login Screen ── */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      text-align: center;
      padding: 2rem;
      animation: fadeUp 1.2s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .playlist-cover {
      width: 180px;
      height: 180px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 0 60px rgba(192, 65, 107, 0.6), 0 0 120px rgba(192, 65, 107, 0.2);
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-12px); }
    }

    .title-block { line-height: 1; }
    .title-block h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      letter-spacing: 0.04em;
      color: #fff;
    }
    .title-block p {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-top: 0.5rem;
    }

    .btn-spotify {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.9rem 2.2rem;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #c2416b, #7b2650);
      color: #fff;
      box-shadow: 0 0 40px rgba(194, 65, 107, 0.5), 0 4px 20px rgba(0,0,0,0.4);
      transition: box-shadow 0.3s, transform 0.2s;
      position: relative;
      overflow: hidden;
    }
    .btn-spotify::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      border-radius: inherit;
    }
    .btn-spotify:hover {
      box-shadow: 0 0 70px rgba(194, 65, 107, 0.8), 0 4px 30px rgba(0,0,0,0.5);
      transform: translateY(-2px);
    }
    .btn-spotify svg { flex-shrink: 0; }

    .open-spotify-link {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      padding-bottom: 2px;
      transition: color 0.2s;
    }
    .open-spotify-link:hover { color: rgba(255,255,255,0.6); }

    /* ── Player Screen ── */
    #player-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 520px;
      padding: 1.5rem;
      gap: 1.2rem;
      animation: fadeUp 0.8s ease both;
    }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .player-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 1.3rem;
      letter-spacing: 0.08em;
    }
    .playlist-link {
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      padding-bottom: 1px;
      transition: color 0.2s;
    }
    .playlist-link:hover { color: rgba(255,255,255,0.7); }

    /* Album art row */
    .art-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      width: 100%;
    }
    #now-art, #playlist-art {
      width: min(190px, 42vw);
      height: min(190px, 42vw);
      border-radius: 10px;
      object-fit: cover;
      transition: box-shadow 0.6s, transform 0.4s;
      animation: float 8s ease-in-out infinite;
    }
    #now-art {
      box-shadow: 0 0 80px rgba(192, 65, 107, 0.5), 0 20px 60px rgba(0,0,0,0.6);
    }
    #now-art.playing {
      box-shadow: 0 0 100px rgba(192, 65, 107, 0.7), 0 0 200px rgba(192, 65, 107, 0.2), 0 20px 60px rgba(0,0,0,0.6);
    }
    #playlist-art {
      box-shadow: 0 0 40px rgba(192, 65, 107, 0.25), 0 20px 40px rgba(0,0,0,0.5);
      opacity: 0.85;
      animation-delay: -3s;
    }

    /* Track info */
    .track-info { text-align: center; width: 100%; }
    #track-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #artist-name {
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-top: 0.3rem;
    }

    /* Progress */
    .progress-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    #progress-bar {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.12);
      cursor: pointer;
      outline: none;
    }
    #progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #c2416b;
      box-shadow: 0 0 8px rgba(194,65,107,0.8);
      cursor: pointer;
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.35);
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 2rem;
    }
    .ctrl-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,0.5);
      transition: color 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
    }
    .ctrl-btn:hover { color: #fff; transform: scale(1.15); }
    .ctrl-btn.play-pause {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #c2416b, #7b2650);
      color: #fff;
      justify-content: center;
      box-shadow: 0 0 30px rgba(194,65,107,0.6);
      transition: box-shadow 0.3s, transform 0.15s;
    }
    .ctrl-btn.play-pause:hover {
      box-shadow: 0 0 50px rgba(194,65,107,0.9);
      transform: scale(1.08);
    }

    /* Volume */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      width: 100%;
    }
    .volume-row svg { color: rgba(255,255,255,0.4); flex-shrink: 0; }
    #volume-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.12);
      cursor: pointer;
      outline: none;
    }
    #volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.6);
      cursor: pointer;
    }

    /* Queue */
    .queue-section { width: 100%; }
    .queue-label {
      font-size: 0.55rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      margin-bottom: 0.6rem;
    }
    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      max-height: 60px;
      overflow-y: hidden;
      scrollbar-width: none;
      opacity: 1;
      transition: opacity 0.5s ease;
    }
    .queue-list.fading { opacity: 0; }
    .queue-list::-webkit-scrollbar { display: none; }
    .queue-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .queue-item:hover { background: rgba(255,255,255,0.06); }
    .queue-item.active { background: rgba(194,65,107,0.15); }
    .queue-thumb {
      width: 32px; height: 32px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .queue-meta { overflow: hidden; flex: 1; }
    .queue-track {
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .queue-artist {
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .queue-dur {
      font-size: 0.55rem;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.08em;
      flex-shrink: 0;
    }
    .adder-avatar {
      width: 20px; height: 20px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      opacity: 0.6;
    }
    .adder-initials {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: rgba(194,65,107,0.3);
      border: 1px solid rgba(194,65,107,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.45rem;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,0.5);
      flex-shrink: 0;
      text-transform: uppercase;
    }
    .full-track-adder {
      width: 22px; height: 22px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      opacity: 0.55;
    }
    .full-track-adder-initials {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: rgba(194,65,107,0.25);
      border: 1px solid rgba(194,65,107,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.45rem;
      color: rgba(255,255,255,0.45);
      flex-shrink: 0;
      text-transform: uppercase;
    }

    /* Error / Loading */
    .status-msg {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.4);
      text-align: center;
    }
    #error-msg {
      color: rgba(232,115,90,0.8);
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-align: center;
      display: none;
    }

    /* Glassmorphism card for player */
    .glass-card {
      background: rgba(26, 10, 30, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 1.5rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* Shuffle button */
    .ctrl-btn.shuffle {
      color: rgba(255,255,255,0.25);
      position: relative;
    }
    .ctrl-btn.shuffle.active {
      color: #c2416b;
      filter: drop-shadow(0 0 6px rgba(194,65,107,0.9));
    }
    .ctrl-btn.shuffle.active::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #c2416b;
      box-shadow: 0 0 6px rgba(194,65,107,1);
    }

    /* Sort toggle */
    .sort-toggle {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 0.2rem 0.6rem;
      cursor: pointer;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.5rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      transition: color 0.2s, border-color 0.2s;
    }
    .sort-toggle:hover { color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.25); }
    .queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem;
    }
    .queue-header .queue-label { margin-bottom: 0; }

    /* Shimmer loading */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position:  400px 0; }
    }
    .shimmer {
      background: linear-gradient(90deg,
        rgba(255,255,255,0.04) 25%,
        rgba(255,255,255,0.10) 50%,
        rgba(255,255,255,0.04) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.8s ease-in-out infinite;
      border-radius: 4px;
      color: transparent !important;
      pointer-events: none;
      user-select: none;
    }
    .shimmer * { visibility: hidden; }
    #now-art.shimmer, #playlist-art.shimmer {
      border-radius: 10px;
      background: linear-gradient(90deg,
        rgba(255,255,255,0.04) 25%,
        rgba(255,255,255,0.09) 50%,
        rgba(255,255,255,0.04) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.8s ease-in-out infinite;
    }

    /* Mini player (sticky header) */
    #mini-player {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      z-index: 100;
      background: rgba(13, 5, 16, 0.78);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 1.25rem;
      transform: translateY(-110%);
      transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
      pointer-events: none;
    }
    #mini-player.visible {
      transform: translateY(0);
      pointer-events: auto;
    }
    #mini-art {
      width: 60px; height: 60px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(194,65,107,0.4);
    }
    .mini-info {
      flex: 1;
      min-width: 0;
    }
    #mini-track {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-weight: 300;
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }
    #mini-artist {
      font-size: 0.55rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 0.2rem;
    }
    .mini-controls {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-shrink: 0;
    }
    .mini-ctrl {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,0.55);
      transition: color 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
      padding: 0.3rem;
    }
    .mini-ctrl:hover { color: #fff; transform: scale(1.12); }
    .mini-ctrl.play-pause {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #c2416b, #7b2650);
      color: #fff;
      justify-content: center;
      box-shadow: 0 0 16px rgba(194,65,107,0.5);
    }
    .mini-ctrl.play-pause:hover {
      box-shadow: 0 0 24px rgba(194,65,107,0.8);
    }
    /* Slim progress bar at bottom of mini player */
    #mini-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2px;
      background: linear-gradient(90deg, #c2416b, #e8735a);
      width: 0%;
      transition: width 0.3s linear;
    }
    @media (max-width: 520px) {
      #mini-player { height: 78px; padding: 0 0.9rem; gap: 0.7rem; }
      #mini-art { width: 50px; height: 50px; }
      #mini-track { font-size: 0.9rem; }
      #mini-artist { font-size: 0.5rem; letter-spacing: 0.18em; }
      .mini-ctrl.play-pause { width: 36px; height: 36px; }
    }

    /* Show playlist button */
    .btn-show-playlist {
      width: 100%;
      max-width: 520px;
      padding: 0.85rem;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      background: rgba(26,10,30,0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(255,255,255,0.45);
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }
    .btn-show-playlist:hover {
      background: rgba(194,65,107,0.12);
      border-color: rgba(194,65,107,0.3);
      color: rgba(255,255,255,0.75);
    }
    .btn-show-playlist .arrow {
      transition: transform 0.3s;
      display: inline-block;
    }
    .btn-show-playlist.open .arrow { transform: rotate(180deg); }

    /* Playlist drawer */
    #playlist-drawer {
      width: 100%;
      max-width: 520px;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.6s cubic-bezier(0.4,0,0.2,1), opacity 0.3s;
      opacity: 0;
    }
    #playlist-drawer.open {
      max-height: 999999px;
      overflow: visible;
      opacity: 1;
    }
    .drawer-inner {
      padding-bottom: 3rem;
    }
    .full-track-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .full-track-item {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.55rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .full-track-item:hover { background: rgba(255,255,255,0.05); }
    .full-track-item.active { background: rgba(194,65,107,0.15); }
    .full-track-num {
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.2);
      width: 24px;
      text-align: right;
      flex-shrink: 0;
    }
    .full-track-thumb {
      width: 40px; height: 40px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .full-track-meta { overflow: hidden; flex: 1; }
    .full-track-name {
      font-size: 0.75rem;
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .full-track-artist {
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-load-more {
      width: 100%;
      margin-top: 0.6rem;
      padding: 0.7rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: rgba(255,255,255,0.55);
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.55rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .btn-load-more:hover {

(function initAurora() {
  const canvas = document.getElementById('aurora');
  const ctx    = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Each orb has independent drift + breathing pulsation phases.
  // Wider colour palette: rose, magenta, blue, violet, orange, red.
  // Larger amplitude and slightly faster frequencies give the dancing motion.
  const orbs = [
    // rose / pink
    { r:[194, 65,107], xP:0.25, yP:0.30, rW:0.70, rH:0.50, alpha:0.40, alphaA:0.15, sxA:0.18, syA:0.12, sxF:0.00009 , syF:0.00007 , sxO:0.0  , syO:1.1 , aF:0.00011, aO:0.3 },
    // deep magenta
    { r:[139, 26,107], xP:0.65, yP:0.55, rW:0.75, rH:0.55, alpha:0.32, alphaA:0.12, sxA:0.20, syA:0.14, sxF:0.00008 , syF:0.00009 , sxO:2.4  , syO:0.7 , aF:0.00013, aO:1.2 },
    // violet / purple
    { r:[110, 60,180], xP:0.40, yP:0.20, rW:0.65, rH:0.45, alpha:0.26, alphaA:0.14, sxA:0.22, syA:0.16, sxF:0.00010 , syF:0.00007 , sxO:4.7  , syO:3.2 , aF:0.00015, aO:2.1 },
    // electric blue
    { r:[ 60,100,200], xP:0.80, yP:0.40, rW:0.60, rH:0.45, alpha:0.22, alphaA:0.12, sxA:0.20, syO:0.13, syA:0.13, sxF:0.00007 , syF:0.00011 , sxO:1.8  , syO:5.0 , aF:0.00012, aO:0.8 },
    // burnt orange
    { r:[232,115, 90], xP:0.15, yP:0.70, rW:0.55, rH:0.40, alpha:0.20, alphaA:0.10, sxA:0.16, syA:0.14, sxF:0.00012 , syF:0.00009 , sxO:3.3  , syO:2.1 , aF:0.00010, aO:3.4 },
    // warm red
    { r:[210, 50, 70], xP:0.70, yP:0.80, rW:0.50, rH:0.40, alpha:0.18, alphaA:0.10, sxA:0.15, syA:0.18, sxF:0.00009 , syF:0.00008 , sxO:5.6  , syO:4.4 , aF:0.00014, aO:1.7 },
    // soft indigo highlight
    { r:[140, 80,220], xP:0.50, yP:0.55, rW:0.45, rH:0.35, alpha:0.16, alphaA:0.10, sxA:0.20, syA:0.16, sxF:0.00013 , syF:0.00010 , sxO:0.9  , syO:6.0 , aF:0.00016, aO:4.7 },
  ];

  // Draw a single soft radial orb.
  // We use a large radial gradient that falls to 0 alpha at the edge —
  // no hard boundary, just an infinite feather.
  function drawOrb(o, t) {
    const cx = W * (o.xP + Math.sin(t * o.sxF + o.sxO) * o.sxA);
    const cy = H * (o.yP + Math.sin(t * o.syF + o.syO) * o.syA);
    const rx = W * o.rW;
    const ry = H * o.rH;
    const [r,g,b] = o.r;
    // Breathing alpha — each orb pulses brightness independently
    const a = Math.max(0, o.alpha + Math.sin(t * o.aF + o.aO) * (o.alphaA || 0));

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, ry / rx);
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    grad.addColorStop(0.00, `rgba(${r},${g},${b},${a.toFixed(3)})`);
    grad.addColorStop(0.35, `rgba(${r},${g},${b},${(a * 0.6).toFixed(3)})`);
    grad.addColorStop(0.65, `rgba(${r},${g},${b},${(a * 0.18).toFixed(3)})`);
    grad.addColorStop(1.00, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, rx, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function frame(ts) {
    ctx.clearRect(0, 0, W, H);

    // Deep space base — static, no recompute needed
    const bg = ctx.createRadialGradient(W*0.5, H*0.38, 0, W*0.5, H*0.38, H);
    bg.addColorStop(0,   '#28102e');
    bg.addColorStop(0.6, '#1a0a22');
    bg.addColorStop(1,   '#0b0410');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Orbs blend additively via 'lighter' composite for that luminous glow
    ctx.globalCompositeOperation = 'lighter';
    orbs.forEach(o => drawOrb(o, ts));
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

// ─────────────────────────────────────────────
// Auth (PKCE)
// ─────────────────────────────────────────────
function base64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function generatePKCE() {
  const verifier  = base64url(crypto.getRandomValues(new Uint8Array(32)));
  const challenge = base64url(await crypto.subtle.digest('SHA-256',
    new TextEncoder().encode(verifier)));
  return { verifier, challenge };
}

async function login() {
  const { verifier, challenge } = await generatePKCE();
  sessionStorage.setItem('pkce_verifier', verifier);
  const url = new URL('https://accounts.spotify.com/authorize');
  url.searchParams.set('client_id',             CLIENT_ID);
  url.searchParams.set('response_type',         'code');
  url.searchParams.set('redirect_uri',          REDIRECT_URI);
  url.searchParams.set('scope',                 SCOPES);
  url.searchParams.set('code_challenge_method', 'S256');
  url.searchParams.set('code_challenge',        challenge);

  // Try popup first; fall back to redirect if blocked
  const w = 480, h = 640;
  const left = Math.round(screen.width  / 2 - w / 2);
  const top  = Math.round(screen.height / 2 - h / 2);
  const popup = window.open(url.toString(), 'spotify-login',
    `width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes`);

  if (!popup || popup.closed || typeof popup.closed === 'undefined') {
    // Popup blocked — fall back to full redirect
    window.location = url.toString();
    return;
  }

  // Poll for popup to close after redirect back
  const poll = setInterval(async () => {
    try {
      const popupUrl = popup.location.href;
      if (popupUrl.startsWith(REDIRECT_URI)) {
        clearInterval(poll);
        const params = new URLSearchParams(new URL(popupUrl).search);
        popup.close();
        const code = params.get('code');
        if (code) {
          await exchangeCode(code);
          // Token stored — now init SDK
          loadSDK();
        } else {
          showError('Login cancelled.');
        }
      }
    } catch(e) {
      // Cross-origin while on Spotify's domain — keep polling
    }
    if (popup.closed) {
      clearInterval(poll);
    }
  }, 300);
}

function loadSDK() {
  if (window.Spotify) {
    window.onSpotifyWebPlaybackSDKReady();
    return;
  }
  const s = document.createElement('script');
  s.src = 'https://sdk.scdn.co/spotify-player.js';
  document.head.appendChild(s);
}

async function exchangeCode(code) {
  const verifier = sessionStorage.getItem('pkce_verifier');
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type:    'authorization_code',
      code,
      redirect_uri:  REDIRECT_URI,
      client_id:     CLIENT_ID,
      code_verifier: verifier,
    }),
  });
  if (!res.ok) throw new Error('Token exchange failed');
  const data = await res.json();
  storeTokens(data);
  return data.access_token;
}

async function refreshToken() {
  const rt = localStorage.getItem('sp_refresh');
  if (!rt) return null;
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type:    'refresh_token',
      refresh_token: rt,
      client_id:     CLIENT_ID,
    }),
  });
  if (!res.ok) return null;
  const data = await res.json();
  storeTokens(data);
  return data.access_token;
}

function storeTokens(data) {
  localStorage.setItem('sp_access',  data.access_token);
  localStorage.setItem('sp_refresh', data.refresh_token || localStorage.getItem('sp_refresh'));
  localStorage.setItem('sp_expiry',  Date.now() + data.expires_in * 1000);
}

async function getToken() {
  const expiry = +localStorage.getItem('sp_expiry') || 0;
  if (Date.now() < expiry - 60000) return localStorage.getItem('sp_access');
  return await refreshToken();
}

// ─────────────────────────────────────────────
// Spotify API helpers
// ─────────────────────────────────────────────
async function api(path, opts = {}) {
  const token = await getToken();
  const res = await fetch('https://api.spotify.com/v1' + path, {
    ...opts,
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  if (res.status === 204) return null;
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function startProgress(position, duration) {
  clearInterval(progressInterval);
  const bar = document.getElementById('progress-bar');
  const cur = document.getElementById('time-current');
  let pos = position;
  bar.max = duration;
  bar.value = pos;
  cur.textContent = ms(pos);
  function updateMiniProgress() {
    const pct = duration ? (pos / duration) * 100 : 0;
    document.getElementById('mini-progress').style.width = pct + '%';
  }
  updateMiniProgress();
  progressInterval = setInterval(() => {
    pos += 1000;
    if (pos > duration) { clearInterval(progressInterval); return; }
    bar.value = pos;
    cur.textContent = ms(pos);
    updateMiniProgress();
  }, 1000);
}

// ─────────────────────────────────────────────

async function fetchPlaylistTracks() {
  // Pull cover image in parallel with first page
  const playlistMetaPromise = api(`/playlists/${PLAYLIST_ID}?fields=images,tracks(total)`);

  // Paginate through ALL tracks (Spotify caps page size at 100)
  const allRaw = [];
  let offset = 0;
  const pageSize = 100;
  while (true) {
    const page = await api(
      `/playlists/${PLAYLIST_ID}/tracks?limit=${pageSize}&offset=${offset}&fields=items(added_by(id),track(uri,name,duration_ms,artists(name),album(images))),next`
    );
    const items = (page?.items || []).filter(i => i.track);
    allRaw.push(...items);
    if (!page?.next) break;
    offset += pageSize;
    // Safety cap so we never spin forever
    if (offset > 10000) break;
  }

  // Collect unique user IDs (cap at first 50 to avoid hammering API)
  const userIds = [...new Set(allRaw.map(i => i.added_by?.id).filter(Boolean))].slice(0, 50);
  const profileMap = {};
  await Promise.all(userIds.map(async id => {
    try {
      const u = await api(`/users/${id}`);
      profileMap[id] = { name: u.display_name || id, img: u.images?.[0]?.url || null };
    } catch(e) {
      profileMap[id] = { name: id, img: null };
    }
  }));

  // Attach adder info; reverse for newest-first default
  trackItems = allRaw.map(i => ({
    ...i.track,
    adder: profileMap[i.added_by?.id] || null,
  })).reverse();

  tracks = trackItems;

  const playlistData = await playlistMetaPromise;
  const coverImg = playlistData?.images?.[0]?.url;
  if (coverImg) {
    const el = document.getElementById('login-cover');
    if (el) el.src = coverImg;
  }
  renderQueue();
}

function adderAvatar(adder, cls, initialsCls) {
  if (!adder) return ''; // show nothing if no adder info
  if (adder.img) return `<img class="${cls}" src="${adder.img}" alt="${adder.name}" title="Added by ${adder.name}" />`;
  const initials = adder.name.split(' ').map(w=>w[0]).join('').slice(0,2);
  return `<div class="${initialsCls}" title="Added by ${adder.name}">${initials}</div>`;
}

function renderQueueItems(items) {
  const list = document.getElementById('queue-list');
  if (!list) return;
  list.innerHTML = '';
  items.forEach(t => {
    const el = document.createElement('div');
    el.className = 'queue-item';
    el.dataset.uri = t.uri;
    const thumb = t.album?.images?.[1]?.url || t.album?.images?.[0]?.url || '';
    // Try to find adder from our local tracks data
    const localTrack = tracks.find(lt => lt.uri === t.uri);
    el.innerHTML = `
      <img class="queue-thumb" src="${thumb}" alt="" />
      <div class="queue-meta">
        <div class="queue-track">${t.name}</div>
        <div class="queue-artist">${t.artists.map(a=>a.name).join(', ')}</div>
      </div>
      ${adderAvatar(localTrack?.adder || null, 'adder-avatar', 'adder-initials')}
      <div class="queue-dur">${ms(t.duration_ms)}</div>
    `;
    el.addEventListener('click', () => playTrack(t.uri));
    list.appendChild(el);
  });
}

async function refreshQueue() {
  const list = document.getElementById('queue-list');
  try {
    const queueData = await api('/me/player/queue');
    if (queueData?.queue?.length) {
      renderQueueItems(queueData.queue.slice(0, 1));
    } else if (tracks.length) {
      const idx = currentUri ? tracks.findIndex(t => t.uri === currentUri) : -1;
      const upcoming = tracks.slice(idx + 1, idx + 2);
      renderQueueItems(upcoming.length ? upcoming : tracks.slice(0, 1));
    }
  } catch(e) {}
  if (list) list.classList.remove('fading');
}

function renderQueue() {
  renderFullList();
  const idx = currentUri ? tracks.findIndex(t => t.uri === currentUri) : -1;
  const upcoming = tracks.slice(idx + 1, idx + 6);
  renderQueueItems(upcoming.length ? upcoming.slice(0, 1) : tracks.slice(0, 1));
}

let visibleCount = 20; // initial page size
const PAGE = 20;

function renderFullList(reset = true) {
  const list = document.getElementById('full-track-list');
  if (!list) return;
  if (reset) {
    list.innerHTML = '';
    visibleCount = PAGE;
  }
  const slice = tracks.slice(0, visibleCount);
  list.innerHTML = '';
  slice.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'full-track-item';
    el.dataset.uri = t.uri;
    const thumb = t.album?.images?.[1]?.url || t.album?.images?.[0]?.url || '';
    el.innerHTML = `
      <div class="full-track-num">${tracks.length - i}</div>
      <img class="full-track-thumb" src="${thumb}" alt="" />
      <div class="full-track-meta">
        <div class="full-track-name">${t.name}</div>
        <div class="full-track-artist">${t.artists.map(a=>a.name).join(', ')}</div>
      </div>
      ${adderAvatar(t.adder, 'full-track-adder', 'full-track-adder-initials')}
      <div class="full-track-dur">${ms(t.duration_ms)}</div>
    `;
    el.addEventListener('click', () => playTrack(t.uri));
    list.appendChild(el);
  });

  // Append load-more button if more tracks remain
  if (visibleCount < tracks.length) {
    const more = document.createElement('button');
    more.className = 'btn-load-more';
    more.textContent = `load ${Math.min(PAGE, tracks.length - visibleCount)} more · ${tracks.length - visibleCount} remaining`;
    more.addEventListener('click', () => {
      visibleCount += PAGE;
      renderFullList(false);
    });
    list.appendChild(more);
  } else if (tracks.length > PAGE) {
    const info = document.createElement('div');
    info.className = 'list-end-note';
    info.textContent = `end of playlist · ${tracks.length} tracks`;
    list.appendChild(info);
  }

  if (currentUri) highlightQueue(currentUri);
}

let playWindowStart = 0; // index into tracks where current chunk began

async function playPlaylist(startUri) {
  if (!tracks.length) return;
  let startIdx = 0;
  if (startUri) {
    const foundIdx = tracks.findIndex(t => t.uri === startUri);
    if (foundIdx === -1) {
      console.warn('[playPlaylist] URI NOT FOUND in tracks array:', startUri);
    } else {
      startIdx = foundIdx;
    }
  }
  playWindowStart = startIdx;
  const uris = tracks.slice(startIdx, startIdx + 100).map(t => t.uri);
  const endpoint = deviceId ? `/me/player/play?device_id=${deviceId}` : '/me/player/play';

  // Spotify quirk: sending uris[] when the first track is already the current
  // context can be ignored. Workaround — pause first to drop the context,
  // then play the new list. This guarantees Spotify treats it as a fresh start.
  try {
    await api(`/me/player/pause${deviceId ? '?device_id=' + deviceId : ''}`, { method: 'PUT' });
  } catch(e) { /* fine if already paused */ }
  await new Promise(r => setTimeout(r, 80));
  await api(endpoint, {
    method: 'PUT',
    body: JSON.stringify({ uris, position_ms: 0 }),
  });
}

// Check if we're approaching end of the current play window; if so, queue more.
// Called after each track change.
async function maybeExtendPlayback() {
  if (!tracks.length || !currentUri) return;
  const curIdx = tracks.findIndex(t => t.uri === currentUri);
  if (curIdx < 0) return;
  const windowEnd = playWindowStart + 100;
  // When user reaches the last 10 tracks of the current window, queue more
  if (curIdx >= windowEnd - 10 && windowEnd < tracks.length) {
    const nextBatch = tracks.slice(windowEnd, windowEnd + 50).map(t => t.uri);
    // Use Spotify's add-to-queue endpoint one at a time (no bulk endpoint exists)
    for (const uri of nextBatch) {
      try {
        await api(`/me/player/queue?uri=${encodeURIComponent(uri)}`, { method: 'POST' });
      } catch(e) { /* silent */ }
    }
    playWindowStart = windowEnd;
  }
}

async function playTrack(uri) {
  await playPlaylist(uri);
}

// ─────────────────────────────────────────────
// Web Playback SDK init
// ─────────────────────────────────────────────
window.onSpotifyWebPlaybackSDKReady = async () => {
  const token = await getToken();
  if (!token) return;

  player = new Spotify.Player({
    name: 'Bedtime Tunes',
    getOAuthToken: async cb => { cb(await getToken()); },
    volume: 0.8,
  });

  player.addListener('ready', async ({ device_id }) => {
    deviceId = device_id;
    // Transfer playback to this device
    await api('/me/player', {
      method: 'PUT',
      body: JSON.stringify({ device_ids: [device_id], play: false }),
    });
    await fetchPlaylistTracks();
    showPlayer();
    // Auto-start playlist
    await playPlaylist();
  });

  player.addListener('not_ready', () => console.log('Device offline'));

  player.addListener('player_state_changed', state => {
    if (!state) return;
    const item = state.track_window?.current_track;
    updateTrackUI(item);
    setPlaying(!state.paused);
    if (state.shuffle !== undefined) updateShuffleUI(state.shuffle);
    if (!state.paused) {
      startProgress(state.position, state.duration);
    } else {
      clearInterval(progressInterval);
      document.getElementById('progress-bar').value = state.position;
      document.getElementById('time-current').textContent = ms(state.position);
    }
    // Fade queue out immediately, clear after fade, refresh after debounce
    const qList = document.getElementById('queue-list');
    if (qList) qList.classList.add('fading');
    // Clear DOM after the fade completes so the swap isn't visible
    clearTimeout(window._queueClearTimer);
    window._queueClearTimer = setTimeout(() => {
      if (qList) qList.innerHTML = '';
    }, 500);
    clearTimeout(window._queueTimer);
    window._queueTimer = setTimeout(() => {
      refreshQueue();
      maybeExtendPlayback();
    }, 1200);
  });

  player.addListener('initialization_error', ({ message }) => showError(message));
  player.addListener('authentication_error',  ({ message }) => showError(message));
  player.addListener('account_error',         ({ message }) => showError('Spotify Premium required: ' + message));

  player.connect();
};

// ─────────────────────────────────────────────
// UI helpers
// ─────────────────────────────────────────────
function showPlayer() {
  document.getElementById('login-screen').style.display  = 'none';
  document.getElementById('player-screen').style.display = 'flex';
  // Add shimmer to elements that need data
  ['now-art','playlist-art','track-name','artist-name'].forEach(id => {
    document.getElementById(id)?.classList.add('shimmer');
  });
  document.getElementById('queue-list').classList.add('fading');
}
function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

// ─────────────────────────────────────────────
// Controls
// ─────────────────────────────────────────────
document.getElementById('login-btn').addEventListener('click', login);

document.getElementById('btn-play').addEventListener('click', () => player?.togglePlay());
document.getElementById('btn-prev').addEventListener('click', () => player?.previousTrack());
document.getElementById('btn-next').addEventListener('click', () => player?.nextTrack());

let shuffleOn = false;

function updateShuffleUI(on) {
  shuffleOn = on;
  document.getElementById('btn-shuffle').classList.toggle('active', on);
  const sortBtn = document.getElementById('btn-sort');
  if (on) {
    sortBtn.disabled = true;
    sortBtn.style.opacity = '0.25';
    sortBtn.style.pointerEvents = 'none';
    sortBtn.title = 'Disabled while shuffle is on';
  } else {
    sortBtn.disabled = false;
    sortBtn.style.opacity = '';
    sortBtn.style.pointerEvents = '';
    sortBtn.title = 'Toggle sort order';
  }
}

document.getElementById('btn-shuffle').addEventListener('click', async () => {
  if (!deviceId) return;
  const next = !shuffleOn;
  try {
    await api(`/me/player/shuffle?state=${next}`, { method: 'PUT' });
    updateShuffleUI(next);
    setTimeout(refreshQueue, 1200);
  } catch(e) {
    console.error('Shuffle toggle failed', e);
  }
});

document.getElementById('progress-bar').addEventListener('input', e => {
  clearInterval(progressInterval);
  player?.seek(+e.target.value).then(() => {
    document.getElementById('time-current').textContent = ms(+e.target.value);
  });
});

document.getElementById('volume-slider').addEventListener('input', e => {
  player?.setVolume(e.target.value / 100);
});

document.getElementById('btn-sort').addEventListener('click', async () => {
  sortNewestFirst = !sortNewestFirst;
  document.getElementById('sort-label').textContent = sortNewestFirst ? 'newest first' : 'oldest first';
  tracks = [...tracks].reverse();
  renderFullList();
  // Rebuild the play queue from the currently playing track in the new order
  if (currentUri) {
    await playPlaylist(currentUri);
  }
});

document.getElementById('btn-show-playlist').addEventListener('click', () => {
  const drawer = document.getElementById('playlist-drawer');
  const btn    = document.getElementById('btn-show-playlist');
  const label  = document.getElementById('playlist-btn-label');
  const open   = drawer.classList.toggle('open');
  btn.classList.toggle('open', open);
  label.textContent = open ? 'hide playlist' : 'show playlist';
});

// ─────────────────────────────────────────────
// Boot: check for auth code in URL
// ─────────────────────────────────────────────
// ─────────────────────────────────────────────
// Mini player wiring
// ─────────────────────────────────────────────
const miniPlayer = document.getElementById('mini-player');
let lastScrollY = 0;

function onScroll() {
  const y = window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
  if (y > 100) {
    miniPlayer.classList.add('visible');
  } else {
    miniPlayer.classList.remove('visible');
  }
  lastScrollY = y;
}
// Run once on load to catch any initial scroll position
window.addEventListener('scroll', onScroll, { passive: true });
document.addEventListener('scroll', onScroll, { passive: true });

document.getElementById('mini-play').addEventListener('click', () => player?.togglePlay());
document.getElementById('mini-prev').addEventListener('click', () => player?.previousTrack());
document.getElementById('mini-next').addEventListener('click', () => player?.nextTrack());

(async function boot() {
  const params = new URLSearchParams(window.location.search);
  const code   = params.get('code');
  const error  = params.get('error');

  if (error) { showError('Spotify login cancelled.'); return; }

  if (code) {
    history.replaceState({}, '', window.location.pathname);
    try {
      await exchangeCode(code);
    } catch(e) {
      showError('Login failed. Try again.');
      return;
    }
  }

  const token = await getToken();
  if (!token) return; // Stay on login screen

  // Token exists — show player shell immediately, SDK loads in background
  showPlayer();
  loadSDK();
})();
</script>
